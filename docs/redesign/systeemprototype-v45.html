            <input class="inp mono" style="max-width:none" value="${v}" ${a.lock?'disabled':''}>
            <span style="font-size:11.5px;color:var(--text-3);white-space:nowrap">${e}</span></div></div>`).join('')}
    </div></div>`;
}
function agBeslissingen(a){
  const rows=DECISIONS.filter(d=>d.ag===a.n);
  return `<div style="padding:14px 20px;background:var(--surface-2);border-bottom:1px solid var(--border);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span style="font-size:12.5px;color:var(--text-3)">Elke beslissing die ${a.n} nam, met de reden erbij</span>
    <span class="pill pill-ok nodot" style="margin-left:auto">${svg(I.refresh,'width:11px;height:11px')} Ververst elke 30 seconden</span>
    <select class="filter-sel"><option>Vandaag</option><option>Deze week</option><option>Alles</option></select></div>
  ${rows.length?table([{l:'Tijd'},{l:'Contact'},{l:'Situatie'},{l:'Zekerheid',cls:'r'},{l:'Wat er gebeurde'},{l:'',cls:'r'}],
    rows.map((d,i)=>[`<span class="mono" style="color:var(--text-3)">${d.t}</span>`,
      `<div style="display:flex;align-items:center;gap:8px">${av(d.wie,24)}<span class="cell-main">${d.wie}</span></div>`,
      pill('neutral',d.intent.replace(/_/g,' '),1),
      `<span class="mono" style="font-weight:600;color:var(--${d.conf>=90?'emerald':d.conf>=80?'amber':'rose'})">${d.conf}%</span>`,
      pill(DST2[d.st].c,DST2[d.st].l),
      `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openBesluit(${DECISIONS.indexOf(d)})">${svg(I.eye)}Waarom</button>`]))
  :`<div class="empty" style="padding:44px 20px"><div class="empty-t">Nog geen beslissingen vandaag</div></div>`}`;
}
function openBesluit(i){
  const d=DECISIONS[i];
  openPanel('Beslissing',`${d.ag} · ${d.t} · ${d.wie}`,`
    <div class="hero-amount" style="padding:18px 20px">
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px">
        ${pill(DST2[d.st].c,DST2[d.st].l)}${pill('neutral',d.intent.replace(/_/g,' '),1)}</div>
      <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">Zekerheid</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="progress" style="flex:1;height:8px"><i style="width:${d.conf}%;background:var(--${d.conf>=90?'emerald':'amber'})"></i></div>
        <span class="mono" style="font-size:17px;font-weight:600">${d.conf}%</span></div></div>
    <div class="sect"><div class="sect-title">Waarom deze keuze</div>
      <p style="font-size:13.5px;line-height:1.65;color:var(--text-2)">${d.reden}</p></div>
    <div class="sect"><div class="sect-title">Controles</div>
      <div class="kv"><dt>Situatie herkend</dt><dd>${pill('ok',d.intent.replace(/_/g,' '),1)}</dd></div>
      <div class="kv"><dt>Binnen mandaat</dt><dd>${d.st==='doorgezet'?pill('danger','Nee'):pill('ok','Ja')}</dd></div>
      <div class="kv"><dt>Boven zekerheidsdrempel</dt><dd>${d.conf>=85?pill('ok','Ja'):pill('warn','Nee')}</dd></div>
      <div class="kv"><dt>Binnen verzendvenster</dt><dd>${pill('ok','Ja')}</dd></div>
      <div class="kv"><dt>Berichtlimiet</dt><dd>2 van 3 vandaag</dd></div></div>
    <div class="sect"><div class="sect-title">Uitkomst</div>
      <div class="msg msg-out" style="max-width:100%">${
        d.st==='doorgezet'?'— geen bericht verstuurd, melding geplaatst in de inbox —'
        :d.st==='voorgesteld'?'Voorstel klaargezet: € 150 per maand, 6 termijnen, eerste betaling 15 augustus.'
        :'Top! Bedankt voor het doorgeven. Ik zet het klaar en check morgen of het binnen is.'}</div></div>`,
    `<button class="btn btn-ghost">${svg(I.chat)}Open gesprek</button>
     <button class="btn btn-ghost">${svg('<path d="M17 14V2M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88z"/>')}Fout beoordeeld</button>
     <button class="btn btn-primary" style="margin-left:auto">${svg(I.tick)}Goed gedaan</button>`);
}
/* ═══════ PANEEL ═══════ */
function openPanel(t,s,b,f){
  document.getElementById('panelTitle').textContent=t;
  document.getElementById('panelSub').innerHTML=s;
  document.getElementById('panelBody').innerHTML=b;
  document.getElementById('panelFoot').innerHTML=f||'';
  document.getElementById('panel').classList.add('open');
  document.getElementById('main').classList.add('panel-open');
  document.body.classList.add('panel-open');
  showHint();
}
function closePanel(silent){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('main').classList.remove('panel-open');
  document.body.classList.remove('panel-open');
  S.selIdx=-1;if(!silent&&document.getElementById('content'))render();
}
const toggleSel=n=>{S.sel[n]=!S.sel[n];render()};
function openFactuur(i){
  S.selIdx=i;const f=S.rows[i];if(!f)return;
  openPanel(f.nr,`${f.klant} · ${f.entity}`,`
    <div class="hero-amount"><div class="lbl">Openstaand</div>
      <div class="big-amount" style="color:${f.open>0?'var(--rose)':'var(--emerald)'}">${f.open>0?eur(f.open):'Voldaan'}</div>
      <div style="margin-top:9px;display:flex;gap:9px;align-items:center">${pill(ST[f.status].c,ST[f.status].l)}
        ${f.dagen>0?`<span style="font-size:12.5px;color:var(--text-3)">${f.dagen} dagen te laat</span>`:''}</div></div>
    <div class="sect"><div class="sect-title">Gegevens</div>
      <div class="kv"><dt>Factuurbedrag</dt><dd class="num">${eur(f.bedrag)}</dd></div>
      <div class="kv"><dt>Betaald</dt><dd class="num">${eur(f.bedrag-f.open)}</dd></div>
      <div class="kv"><dt>Factuurdatum</dt><dd class="num">${f.datum}</dd></div>
      <div class="kv"><dt>Vervaldatum</dt><dd class="num">${f.verval}</dd></div></div>
    <div class="sect"><div class="sect-title">Verloop</div><div class="timeline">
      <div class="tl-item hi"><div class="tl-when">Vandaag 09:01</div><div class="tl-what">Aanmaning dag 7 via WhatsApp</div></div>
      <div class="tl-item"><div class="tl-when">${f.verval}</div><div class="tl-what">Vervaldatum verstreken</div></div>
      <div class="tl-item"><div class="tl-when">${f.datum}</div><div class="tl-what">Factuur verstuurd</div></div></div></div>
    <div class="sect"><div class="sect-title">Regels</div>
      <div class="kv"><dt>1-op-1 begeleiding 12 maanden</dt><dd class="num">${eur(f.bedrag*.91)}</dd></div>
      <div class="kv"><dt>E-book</dt><dd class="num">${eur(f.bedrag*.09)}</dd></div></div>`,
    `<div class="dd"><button class="btn btn-ghost" onclick="event.stopPropagation();toggleDD()">${svg(I.dots)}</button>
      <div class="dd-menu" id="ddMenu">
        <button class="dd-item" onclick="ddDo('Bewerken')">${svg(I.edit)}Bewerken</button>
        <button class="dd-item" onclick="ddDo('Crediteren')">${svg(I.copy)}Crediteren</button>
        <button class="dd-item" onclick="ddDo('Opnieuw versturen')">${svg(I.send)}Opnieuw versturen</button>
        <div class="dd-sep"></div><button class="dd-item danger" onclick="ddDo('Verwijderen')">${svg(I.trash)}Verwijderen</button></div></div>
     <button class="btn btn-ghost">${svg(I.chat)}Bericht</button>
     <button class="btn btn-primary" style="margin-left:auto">Markeer betaald</button>`);
  render();
}
function openAbo(i){
  S.selIdx=i;const a=S.rows[i];if(!a)return;
  openPanel(a.klant,a.plan,`
    <div class="hero-amount"><div class="lbl">Per maand</div><div class="big-amount">${eur(a.mrr)}</div>
      <div style="margin-top:9px;display:flex;gap:9px;align-items:center">${pill(a.status==='actief'?'ok':a.status==='achterstand'?'warn':'neutral',a.status)}
      <span style="font-size:12.5px;color:var(--text-3)">termijn ${a.termijn}</span></div></div>
    <div class="sect"><div class="sect-title">Gegevens</div>
      <div class="kv"><dt>Startdatum</dt><dd class="num">${a.start}</dd></div>
      <div class="kv"><dt>Totale waarde</dt><dd class="num">${eur(a.mrr*parseInt(a.termijn.split('/')[1]))}</dd></div></div>
    <div class="sect"><div class="sect-title">Termijnen</div>
      ${[1,2,3].map(n=>`<div class="kv"><dt>Termijn ${n} · ${n<=parseInt(a.termijn)?'betaald':'gepland'}</dt>
        <dd class="num" style="color:${n<=parseInt(a.termijn)?'var(--emerald)':'var(--text-3)'}">${eur(a.mrr)}</dd></div>`).join('')}</div>`,
    `<button class="btn btn-ghost">Pauzeren</button><button class="btn btn-ghost">Stoppen</button>
     <button class="btn btn-primary" style="margin-left:auto">Bewerken</button>`);
  render();
}
function openOfferte(i){
  S.selIdx=i;const o=S.rows[i];if(!o)return;
  const aboRow=o.abo
    ?`<div class="linkrow done"><span class="linkrow-ico" style="background:var(--emerald)">${svg(I.tick)}</span>
       <div style="flex:1"><div class="linkrow-t">Abonnement aangemaakt</div>
       <div class="linkrow-s">${o.traject} · ${eur(o.totaal/12)} per maand</div></div>
       <button class="btn btn-ghost btn-sm">Bekijken</button></div>`
    :`<button class="linkrow actionable" onclick="alert('Abonnement-wizard opent voor ${o.klant}')">
       <span class="linkrow-ico" style="background:var(--rose)">${svg(I.x)}</span>
       <div style="flex:1"><div class="linkrow-t">Nog geen abonnement</div>
       <div class="linkrow-s">Klik om het abonnement aan te maken</div></div>
       ${svg('<path d="m9 18 6-6-6-6"/>','width:15px;height:15px;color:var(--rose)')}</button>`;
  openPanel(o.nr,`${o.klant} · ${o.verkoper}`,`
    <div class="hero-amount"><div class="lbl">Offertebedrag</div><div class="big-amount">${eur(o.totaal)}</div>
      <div style="margin-top:9px">${pill(OST[o.status].c,OST[o.status].l)}</div></div>
    <div class="sect"><div class="sect-title">Abonnement</div>${aboRow}</div>
    <div class="sect"><div class="sect-title">Gegevens</div>
      <div class="kv"><dt>Traject</dt><dd>${o.traject}</dd></div>
      <div class="kv"><dt>Datum</dt><dd class="num">${o.datum}</dd></div>
      <div class="kv"><dt>Verkoper</dt><dd>${o.verkoper}</dd></div></div>
    <div class="sect"><div class="sect-title">Regels</div>
      <div class="kv"><dt>${o.traject}</dt><dd class="num">${eur(o.totaal*.91)}</dd></div>
      <div class="kv"><dt>E-book</dt><dd class="num">${eur(o.totaal*.09)}</dd></div></div>`,
    `<div class="dd"><button class="btn btn-ghost" onclick="event.stopPropagation();toggleDD()">${svg(I.dots)}</button>
      <div class="dd-menu" id="ddMenu">
        <button class="dd-item" onclick="ddDo('Bewerken')">${svg(I.edit)}Bewerken</button>
        <button class="dd-item" onclick="ddDo('Kopiëren')">${svg(I.copy)}Kopiëren</button>
        <button class="dd-item" onclick="ddDo('Status vernieuwen')">${svg(I.refresh)}Status vernieuwen</button>
        <div class="dd-sep"></div><button class="dd-item danger" onclick="ddDo('Verwijderen')">${svg(I.trash)}Verwijderen</button></div></div>
     <button class="btn btn-ghost">${svg(I.chat)}Bericht</button>
     <button class="btn btn-primary" style="margin-left:auto">${svg(I.send)}Versturen</button>`);
  render();
}
function openActie(i){
  S.selIdx=i;const a=ACTIES[i];
  openPanel(a.type,`${a.klant} · ${a.dagen} dagen open`,`
    <div class="hero-amount"><div class="lbl">Openstaand bedrag</div><div class="big-amount">${eur(a.bedrag)}</div></div>
    <div class="sect"><div class="sect-title">Aanleiding</div>
      <p style="font-size:13.5px;color:var(--text-2);line-height:1.6">Joost detecteerde een betaal-toezegging in het gesprek. Bevestig of de afspraak klopt — dan pauzeert de aanmaan-flow tot de afgesproken datum.</p></div>
    <div class="sect"><div class="sect-title">Uit het gesprek</div>
      <div class="msg msg-in" style="max-width:100%">Ik betaal volgende week vrijdag, dan komt mijn salaris binnen.</div></div>`,
    `<button class="btn btn-ghost">Afwijzen</button><button class="btn btn-ghost">Uitstellen</button>
     <button class="btn btn-primary" style="margin-left:auto">Bevestigen</button>`);
  render();
}
function openRetentie(i){
  const r=S.rows[i];if(!r)return;S.selIdx=i;
  openPanel(r.klant,`${r.plan} · loopt af ${r.eind}`,`
    <div class="hero-amount"><div class="lbl">MRR op het spel</div><div class="big-amount">${eur(r.mrr)}</div>
      <div style="margin-top:9px;display:flex;gap:9px;align-items:center">${pill(RST[r.status].c,RST[r.status].l)}
      <span style="font-size:12.5px;color:var(--text-3)">nog ${r.resterend} termijnen</span></div></div>
    <div class="sect"><div class="sect-title">Verlengen</div>
      <button class="linkrow actionable" style="border-color:var(--violet-line);background:var(--violet-soft)"
        onclick="alert('Verlengingsvoorstel voor ${r.klant}')">
        <span class="linkrow-ico" style="background:var(--violet)">${svg(I.doc)}</span>
        <div style="flex:1"><div class="linkrow-t">Verlengingsvoorstel maken</div>
        <div class="linkrow-s">Nieuwe offerte met de huidige voorwaarden</div></div>
        ${svg('<path d="m9 18 6-6-6-6"/>','width:15px;height:15px;color:var(--violet)')}</button></div>
    <div class="sect"><div class="sect-title">Gegevens</div>
      <div class="kv"><dt>Einddatum</dt><dd class="num">${r.eind}</dd></div>
      <div class="kv"><dt>Resterende termijnen</dt><dd class="num">${r.resterend}</dd></div>
      <div class="kv"><dt>Eigenaar</dt><dd>${r.eigenaar}</dd></div></div>`,
    `<button class="btn btn-ghost">${svg(I.chat)}Bericht</button>
     <button class="btn btn-ghost">Markeer 'wil stoppen'</button>
     <button class="btn btn-primary" style="margin-left:auto">Markeer verlengd</button>`);
  render();
}
function stepRow(d){
  const n=S.selIdx+d;if(n<0||n>=S.rows.length)return;
  const t=S.mod+'/'+S.tab;
  if(t==='finance/Facturen')openFactuur(n);
  else if(t==='finance/Abonnementen')openAbo(n);
  else if(t==='sales/Offertes')openOfferte(n);
  else if(t==='sales/Retentie')openRetentie(n);
  else if(t.includes('Acties'))openActie(n);
  else if(S.mod==='taken')openTaak(n);
  else if(S.mod==='studenten')openStudent(n);
}
function toggleDD(){const m=document.getElementById('ddMenu');if(m)m.classList.toggle('open')}
function ddDo(a){const m=document.getElementById('ddMenu');if(m)m.classList.remove('open');alert(a)}
document.addEventListener('click',e=>{
  const m=document.getElementById('ddMenu');
  if(m&&!e.target.closest('.dd'))m.classList.remove('open');
});
function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  document.getElementById('themeIcon').innerHTML=d
    ?'<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>'
    :'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
let hintT;
function showHint(){
  const h=document.getElementById('hint');
  h.innerHTML=`Blader met <span class="kbd">↑</span><span class="kbd">↓</span> · sluit met <span class="kbd">Esc</span>`;
  h.classList.add('show');clearTimeout(hintT);hintT=setTimeout(()=>h.classList.remove('show'),3400);
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape')closePanel();
  if(document.getElementById('panel').classList.contains('open')){
    if(e.key==='ArrowDown'){e.preventDefault();stepRow(1)}
    if(e.key==='ArrowUp'){e.preventDefault();stepRow(-1)}
  }
});
setRole('super_admin');
</script>
</body>
</html>
