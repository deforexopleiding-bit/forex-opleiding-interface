<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Forex Opleiding — Systeem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F2F4F7; --surface-3:#E9EDF2;
  --border:#E2E7EE; --border-strong:#C9D2DE;
  --text:#111721; --text-2:#586374; --text-3:#8B95A5;
  --blue:#1B5FBF; --blue-soft:#E8F0FC; --blue-line:#B7D0F2;
  --violet:#6D3FD4; --violet-soft:#F0EAFC; --violet-line:#CDBAF3;
  --amber:#C2700A; --amber-soft:#FDF3E3; --amber-line:#F2D9AE;
  --rose:#C22B3E; --rose-soft:#FDECEE; --rose-line:#F5C2C9;
  --emerald:#07835A; --emerald-soft:#E4F5EE; --emerald-line:#A9DFC9;
  --teal:#0A7490; --teal-soft:#E2F3F8; --teal-line:#A5D8E8;
  --pink:#B32B72; --pink-soft:#FCEAF3; --pink-line:#F2BDD8;
  --slate:#455367; --slate-soft:#EDF0F4; --slate-line:#C6CFDB;
  --shadow-xs:0 1px 2px rgba(17,23,33,.05);
  --shadow:0 1px 3px rgba(17,23,33,.06), 0 8px 24px -6px rgba(17,23,33,.08);
  --shadow-lg:0 2px 6px rgba(17,23,33,.07), 0 18px 40px -10px rgba(17,23,33,.14);
  --shadow-panel:-14px 0 44px -12px rgba(17,23,33,.18);
  --r:10px; --r-sm:7px; --r-lg:14px;
  --sidebar-w:228px; --panel-w:520px;
}
[data-theme="dark"]{
  --bg:#0B0E13; --surface:#131820; --surface-2:#1A2029; --surface-3:#232B36;
  --border:#242C37; --border-strong:#36414F;
  --text:#EAEEF4; --text-2:#9AA5B4; --text-3:#6C7788;
  --blue:#5FA0EC; --blue-soft:#132844; --blue-line:#2B4468;
  --violet:#A585F0; --violet-soft:#1F1838; --violet-line:#3B2E63;
  --amber:#E4A85C; --amber-soft:#2C2114; --amber-line:#4A3820;
  --rose:#EE8B96; --rose-soft:#2E1619; --rose-line:#4D262C;
  --emerald:#4FC79B; --emerald-soft:#0D2A20; --emerald-line:#1B4736;
  --teal:#4FB3D0; --teal-soft:#0C242C; --teal-line:#1B4453;
  --pink:#E884B4; --pink-soft:#2C1522; --pink-line:#4B2439;
  --slate:#93A2B7; --slate-soft:#1B222B; --slate-line:#333F4E;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px -6px rgba(0,0,0,.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -10px rgba(0,0,0,.6);
  --shadow-panel:-14px 0 44px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;height:100vh;height:100dvh;overflow:hidden}
.num,.mono,.money{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:3.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;height:100vh;height:100dvh}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);flex-shrink:0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-right:1px solid var(--border)}
.brand{padding:16px 15px 14px;display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand-mark{width:31px;height:31px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(140deg,#2D74D6,#1B4EA0 60%,#153F86);display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:14px;box-shadow:0 2px 8px -1px rgba(27,95,191,.45)}
.brand-name{font-weight:600;font-size:13.5px;letter-spacing:-.015em;line-height:1.25}
.brand-sub{font-size:10.5px;color:var(--text-3);letter-spacing:.03em}
.nav{flex:1;padding:2px 9px 12px;overflow-y:auto}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-3);padding:13px 9px 5px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7.5px 9px;
  border-radius:var(--r-sm);font-size:13px;color:var(--text-2);text-align:left;
  transition:all .14s;margin-bottom:1px;position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;
  background:var(--surface-2);color:var(--text-3);transition:all .14s}
.nav-ico svg{width:14px;height:14px}
.nav-item:hover .nav-ico{color:var(--text-2)}
.nav-item.active{color:var(--text);font-weight:600;background:var(--m-soft)}
.nav-item.active .nav-ico{background:var(--m);color:#fff;box-shadow:0 2px 7px -1px var(--m-glow)}
[data-theme="dark"] .nav-item.active .nav-ico{color:#0B0E13}
.nav-item.active::before{content:'';position:absolute;left:-9px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--m)}
.nav-badge{margin-left:auto;font-size:10px;font-weight:700;padding:1.5px 6px;border-radius:20px;
  background:var(--rose);color:#fff}
[data-theme="dark"] .nav-badge{color:#0B0E13}
.nav-badge.soft{background:var(--surface-3);color:var(--text-3)}
.sidebar-foot{padding:9px;border-top:1px solid var(--border);flex-shrink:0}
.rolebox{background:var(--surface-2);border-radius:var(--r-sm);padding:8px 9px;margin-bottom:8px}
.rolebox-l{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.rolebox-l svg{width:11px;height:11px}
.role-sel{width:100%;padding:5px 7px;border-radius:5px;background:var(--surface);
  border:1px solid var(--border);font-size:12.5px;outline:none;cursor:pointer;font-weight:500}
.user-row{display:flex;align-items:center;gap:9px;padding:4px 3px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:600;flex-shrink:0;color:#fff}
.user-name{font-size:12.5px;font-weight:500;line-height:1.3}
.user-role{font-size:10.5px;color:var(--text-3)}
.icon-btn{width:29px;height:29px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--text-3);transition:all .14s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:16px;height:16px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;transition:margin-right .24s cubic-bezier(.32,.72,0,1)}
.main.panel-open{margin-right:var(--panel-w)}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;padding:0 20px;gap:14px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.page-title{font-size:16px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.title-dot{width:7px;height:7px;border-radius:50%;background:var(--m);box-shadow:0 0 0 3px var(--m-soft)}
.crumb-sep{color:var(--text-3);font-size:13px}
.crumb-cur{color:var(--text-2);font-weight:500;font-size:14px}
.searchbox{margin-left:auto;position:relative;width:260px}
.searchbox input{width:100%;padding:7px 34px 7px 32px;background:var(--surface-2);
  border:1px solid transparent;border-radius:var(--r-sm);font-size:13px;outline:none;transition:all .14s}
.searchbox input:focus{border-color:var(--m);background:var(--surface);box-shadow:0 0 0 3px var(--m-soft)}
.searchbox>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-3)}
.kbd{font-size:10px;font-family:'IBM Plex Mono',monospace;padding:2px 5px;border-radius:4px;
  background:var(--surface-3);color:var(--text-3);position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.tabs{flex-shrink:0;display:flex;gap:3px;padding:0 16px;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:10px 13px 11px;font-size:13.5px;color:var(--text-2);white-space:nowrap;
  border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .14s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--m);border-bottom-color:var(--m);font-weight:600}
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:20px}

/* KPI */
.hero{padding:20px 20px 4px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:15px 17px 16px;cursor:pointer;transition:all .18s cubic-bezier(.32,.72,0,1);
  position:relative;overflow:hidden;box-shadow:var(--shadow-xs)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.kpi::after{content:'';position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--kc),transparent 85%);opacity:.9}
.kpi-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.kpi-ico{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;
  background:var(--kc-soft);color:var(--kc)}
.kpi-ico svg{width:14px;height:14px}
.kpi-label{font-size:12px;color:var(--text-2);font-weight:500}
.kpi-val{font-size:25px;font-weight:600;letter-spacing:-.035em;line-height:1.1}
.kpi-foot{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11.5px;color:var(--text-3)}
.trend{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:11.5px;padding:1px 6px;border-radius:20px}
.trend svg{width:11px;height:11px}
.trend-up{background:var(--emerald-soft);color:var(--emerald)}
.trend-down{background:var(--rose-soft);color:var(--rose)}
.trend-flat{background:var(--surface-3);color:var(--text-3)}
.spark{display:flex;align-items:flex-end;gap:2.5px;height:26px;margin-top:11px}
.spark i{flex:1;border-radius:2px;background:var(--kc);opacity:.22;transition:opacity .2s}
.spark i.hi{opacity:1}
.kpi:hover .spark i{opacity:.45}
.kpi:hover .spark i.hi{opacity:1}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 20px;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:6}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
  background:var(--surface-2);font-size:12.5px;color:var(--text-2);transition:all .14s;
  white-space:nowrap;border:1px solid transparent}
.chip:hover{background:var(--surface-3);color:var(--text)}
.chip.on{background:var(--m);color:#fff;font-weight:500;box-shadow:0 2px 8px -2px var(--m-glow)}
[data-theme="dark"] .chip.on{color:#0B0E13}
.chip .cnt{font-size:11px;opacity:.65;font-family:'IBM Plex Mono',monospace}
.chip.on .cnt{opacity:.8}
.filter-sel{padding:6px 10px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid transparent;font-size:12.5px;color:var(--text-2);outline:none;cursor:pointer}
.filter-sel:hover{background:var(--surface-3)}
.tb-search{position:relative;width:210px}
.tb-search input{width:100%;padding:6px 10px 6px 30px;background:var(--surface-2);
  border:1px solid transparent;border-radius:var(--r-sm);font-size:12.5px;outline:none;transition:all .14s}
.tb-search input:focus{border-color:var(--m);background:var(--surface);box-shadow:0 0 0 3px var(--m-soft)}
.tb-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text-3)}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-sm);
  font-size:13px;font-weight:500;transition:all .14s;white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--m);color:#fff;box-shadow:0 2px 9px -2px var(--m-glow)}
[data-theme="dark"] .btn-primary{color:#0B0E13}
.btn-primary:hover{filter:brightness(1.09);transform:translateY(-1px)}
.btn-ghost{background:var(--surface-2);color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12.5px}

/* TABEL */
.tbl-wrap{background:var(--surface)}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);padding:10px 16px;border-bottom:1px solid var(--border);
  background:var(--surface);position:sticky;top:0;z-index:4;white-space:nowrap}
thead th.r{text-align:right}
thead th.c{text-align:center}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--m-soft)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--m)}
tbody td{padding:11px 16px;font-size:13.5px;vertical-align:middle}
tbody td.r{text-align:right}
tbody td.c{text-align:center}
.cell-main{font-weight:500}
.cell-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.money{font-weight:500;font-size:13px}
.optional{display:table-cell}
.panel-open .optional{display:none}
.row-avatar{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:20px;
  font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill.nodot::before{display:none}
.pill-ok{background:var(--emerald-soft);color:var(--emerald);border-color:var(--emerald-line)}
.pill-warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.pill-danger{background:var(--rose-soft);color:var(--rose);border-color:var(--rose-line)}
.pill-neutral{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.pill-accent{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.pill-violet{background:var(--violet-soft);color:var(--violet);border-color:var(--violet-line)}
.pill-teal{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.pill-pink{background:var(--pink-soft);color:var(--pink);border-color:var(--pink-line)}
.checkbox{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-strong);
  display:grid;place-items:center;flex-shrink:0;transition:all .14s}
.checkbox:hover{border-color:var(--m)}
.checkbox.on{background:var(--m);border-color:var(--m)}
.checkbox svg{width:10px;height:10px;color:#fff;opacity:0}
.checkbox.on svg{opacity:1}
.bulkbar{position:sticky;bottom:14px;z-index:8;margin:0 20px;background:var(--text);color:var(--bg);
  border-radius:var(--r-lg);display:flex;align-items:center;gap:11px;padding:11px 16px;box-shadow:var(--shadow-lg)}
[data-theme="dark"] .bulkbar{background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong)}
.bulkbar .btn-ghost{background:rgba(255,255,255,.12);color:inherit}
[data-theme="dark"] .bulkbar .btn-ghost{background:var(--surface);color:var(--text-2)}

/* PANEEL */
.panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);background:var(--surface);
  border-left:1px solid var(--border);box-shadow:var(--shadow-panel);transform:translateX(100%);
  transition:transform .24s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;z-index:40}
.panel.open{transform:translateX(0)}
.panel-head{padding:16px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.panel-title{font-size:17px;font-weight:600;letter-spacing:-.025em}
.panel-sub{font-size:12.5px;color:var(--text-3);margin-top:3px}
.panel-nav{display:flex;gap:1px;margin-left:auto}
.panel-body{flex:1;overflow-y:auto}
.panel-foot{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--surface-2)}
.hero-amount{padding:20px;background:linear-gradient(160deg,var(--m-soft),transparent 75%);
  border-bottom:1px solid var(--border)}
.hero-amount .lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px}
.big-amount{font-size:31px;font-weight:600;letter-spacing:-.035em;font-family:'IBM Plex Mono',monospace;
  font-variant-numeric:tabular-nums;line-height:1.05}
.sect{padding:17px 20px;border-bottom:1px solid var(--border)}
.sect:last-child{border-bottom:none}
.sect-title{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:11px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:none}
.kv dt{color:var(--text-3)}
.kv dd{font-weight:500;text-align:right}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:5.5px;top:8px;bottom:8px;width:1.5px;background:var(--border)}
.tl-item{position:relative;padding-bottom:15px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-20px;top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);border:2px solid var(--border-strong)}
.tl-item.hi::before{border-color:var(--m);background:var(--m);box-shadow:0 0 0 3px var(--m-soft)}
.tl-when{font-size:11px;color:var(--text-3);font-family:'IBM Plex Mono',monospace}
.tl-what{font-size:13.5px;margin-top:2px}

/* CHAT */
.chat-split{display:flex;height:100%}
.chat-list{width:288px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--surface)}
.chat-row{padding:12px 15px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative}
.chat-row:hover{background:var(--surface-2)}
.chat-row.sel{background:var(--m-soft)}
.chat-row.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m)}
.chat-top{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.chat-name{font-size:13.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-time{font-size:10.5px;color:var(--text-3);font-family:'IBM Plex Mono',monospace;flex-shrink:0}
.chat-prev{font-size:12.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:37px;margin-top:-2px}
.unread{background:var(--rose);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;
  border-radius:9px;display:grid;place-items:center;padding:0 5px;flex-shrink:0}
[data-theme="dark"] .unread{color:#0B0E13}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.chat-head{padding:13px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:70%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;box-shadow:var(--shadow-xs)}
.msg-in{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg-out{background:var(--m-soft);border:1px solid var(--m-line);border-bottom-right-radius:5px}
.msg-meta{font-size:10px;color:var(--text-3);margin-bottom:5px;display:flex;gap:7px;align-items:center;font-family:'IBM Plex Mono',monospace}
.chat-compose{padding:13px 20px;background:var(--surface);border-top:1px solid var(--border)}
.compose-box{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:11px 13px;font-size:13.5px;color:var(--text-3)}
.compose-acts{display:flex;gap:7px;margin-top:10px;align-items:center}
.banner{padding:9px 20px;background:var(--amber-soft);color:var(--amber);font-size:12.5px;
  display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--amber-line)}
.banner svg{width:14px;height:14px;flex-shrink:0}

/* CARDS */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow-xs);transition:box-shadow .18s,transform .18s}
.card-hover:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card-head{padding:14px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-title{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.card-body{padding:16px 17px}
.card-list .cl-row{padding:11px 17px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;gap:12px;font-size:13.5px;transition:background .12s}
.card-list .cl-row:last-child{border-bottom:none}
.card-list .cl-row:hover{background:var(--surface-2)}
.tile-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.tile-ico svg{width:17px;height:17px}
.chart{width:100%;height:140px;display:block}
.chart-grid line{stroke:var(--border);stroke-width:1}
.chart-area{fill:url(#gradA)}
.chart-line{fill:none;stroke:var(--m);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart-dot{fill:var(--surface);stroke:var(--m);stroke-width:2.2}
.chart-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);
  font-family:'IBM Plex Mono',monospace;margin-top:7px}
.bar-stack{height:9px;border-radius:5px;overflow:hidden;display:flex;background:var(--surface-3);margin-bottom:15px}
.bar-stack span{height:100%}
.legend-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.legend-row:last-child{border-bottom:none}
.legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.progress{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;border-radius:4px;background:var(--m)}

/* DOSSIER */
.dossier-head{background:var(--surface);border-bottom:1px solid var(--border);padding:22px 20px 18px;position:relative;overflow:hidden}
.dossier-head::before{content:'';position:absolute;top:0;right:0;width:340px;height:100%;
  background:linear-gradient(250deg,var(--m-soft),transparent 70%);pointer-events:none}
.dossier-top{display:flex;align-items:flex-start;gap:15px;position:relative}
.avatar-lg{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;
  font-size:19px;font-weight:600;flex-shrink:0;color:#fff;box-shadow:var(--shadow)}
.dossier-name{font-size:21px;font-weight:600;letter-spacing:-.028em}
.dossier-meta{font-size:12.5px;color:var(--text-3);margin-top:5px;display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.stat-row{display:flex;margin-top:20px;position:relative;flex-wrap:wrap}
.stat{padding-right:28px;margin-right:28px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-l{font-size:11px;color:var(--text-3);margin-bottom:3px;font-weight:500}
.stat-v{font-size:18px;font-weight:600;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}

.empty{padding:60px 20px;text-align:center}
.empty-ico{width:46px;height:46px;border-radius:13px;background:var(--surface-2);color:var(--text-3);
  display:grid;place-items:center;margin:0 auto 15px}
.empty-ico svg{width:21px;height:21px}
.empty-t{font-size:14.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.empty-s{font-size:13px;max-width:380px;margin:0 auto;color:var(--text-3);line-height:1.55}

.hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(8px);z-index:60;
  background:var(--text);color:var(--bg);padding:9px 15px;border-radius:22px;font-size:12.5px;
  display:flex;gap:9px;align-items:center;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
  transition:all .24s cubic-bezier(.32,.72,0,1)}
[data-theme="dark"] .hint{background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong)}
.hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint .kbd{position:static;transform:none;background:rgba(255,255,255,.18);color:inherit}
[data-theme="dark"] .hint .kbd{background:var(--surface)}

/* DROPDOWN */
.dd{position:relative;display:inline-block}
.dd-menu{position:absolute;bottom:calc(100% + 6px);right:0;min-width:190px;z-index:70;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow-lg);padding:5px;display:none}
.dd-menu.open{display:block}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);
  font-size:13.5px;color:var(--text-2);text-align:left;transition:all .12s}
.dd-item:hover{background:var(--surface-2);color:var(--text)}
.dd-item svg{width:15px;height:15px;opacity:.7}
.dd-item.danger{color:var(--rose)}
.dd-item.danger:hover{background:var(--rose-soft)}
.dd-sep{height:1px;background:var(--border);margin:5px 0}

/* LINKROW */
.linkrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--surface-2);transition:all .15s;width:100%;text-align:left}
.linkrow.actionable{cursor:pointer;border-color:var(--rose-line);background:var(--rose-soft)}
.linkrow.actionable:hover{filter:brightness(.98);transform:translateY(-1px)}
.linkrow.done{border-color:var(--emerald-line);background:var(--emerald-soft)}
.linkrow-ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:#fff}
.linkrow-ico svg{width:16px;height:16px;stroke-width:2.6}
.linkrow-t{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.linkrow-s{font-size:12px;color:var(--text-3);margin-top:1px}

/* SETTINGS */
.set-split{display:flex;height:100%}
.set-nav{width:236px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);padding:10px 9px}
.set-group{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-3);padding:13px 9px 5px}
.set-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:var(--r-sm);
  font-size:13px;color:var(--text-2);text-align:left;transition:all .13s;margin-bottom:1px}
.set-item:hover{background:var(--surface-2);color:var(--text)}
.set-item.on{background:var(--m-soft);color:var(--m);font-weight:600}
.set-item svg{width:14px;height:14px;opacity:.8;flex-shrink:0}
.set-body{flex:1;overflow-y:auto}
.set-head{padding:20px 22px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.set-h1{font-size:18px;font-weight:600;letter-spacing:-.025em}
.set-p{font-size:13px;color:var(--text-3);margin-top:4px;max-width:600px;line-height:1.55}
.field{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;gap:20px;align-items:flex-start}
.field-l{width:230px;flex-shrink:0}
.field-t{font-size:13.5px;font-weight:500}
.field-d{font-size:12px;color:var(--text-3);margin-top:2px;line-height:1.5}
.field-c{flex:1;min-width:0}
.inp{width:100%;max-width:380px;padding:7px 11px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);font-size:13.5px;outline:none;transition:all .14s}
.inp:focus{border-color:var(--m);box-shadow:0 0 0 3px var(--m-soft)}
textarea.inp{max-width:520px;min-height:90px;resize:vertical;font-family:inherit;line-height:1.55}
.switch{width:40px;height:23px;border-radius:12px;background:var(--surface-3);position:relative;
  cursor:pointer;transition:background .18s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--m)}
.switch.on::after{transform:translateX(17px)}
.rbac-tbl th:first-child{width:auto}
.rbac-tbl th.c,.rbac-tbl td.c{text-align:center;width:92px}
.tick-y{color:var(--emerald)}
.tick-n{color:var(--text-3);opacity:.4}
.rbac-cell{cursor:pointer;display:inline-flex;padding:3px;border-radius:5px;transition:background .12s}
.rbac-cell:hover{background:var(--surface-2)}

/* KANBAN */
.kanban{display:flex;gap:13px;padding:20px;overflow-x:auto;height:100%;align-items:flex-start}
.kcol{width:262px;flex-shrink:0;background:var(--surface-2);border-radius:var(--r-lg);padding:11px}
.kcol-head{display:flex;align-items:center;gap:8px;padding:2px 4px 11px}
.kcol-title{font-size:12.5px;font-weight:600}
.kcol-cnt{font-size:11px;color:var(--text-3);font-family:'IBM Plex Mono',monospace;
  background:var(--surface);padding:1px 7px;border-radius:20px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-xs)}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kcard-t{font-size:13px;font-weight:500;margin-bottom:5px}
.kcard-m{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3)}

/* CALENDAR */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin:20px}
.cal-h{background:var(--surface);padding:9px;text-align:center;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.cal-d{background:var(--surface);min-height:96px;padding:8px;transition:background .12s;cursor:pointer}
.cal-d:hover{background:var(--surface-2)}
.cal-d.off{background:var(--surface-2);color:var(--text-3)}
.cal-n{font-size:12px;font-weight:600;font-family:'IBM Plex Mono',monospace;margin-bottom:6px}
.cal-d.today .cal-n{color:#fff;background:var(--m);width:21px;height:21px;border-radius:50%;
  display:grid;place-items:center;font-size:11px}
.cal-e{font-size:11px;padding:3px 6px;border-radius:5px;margin-bottom:3px;
  background:var(--m-soft);color:var(--m);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.soon-card{background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-lg);
  padding:18px;cursor:pointer;transition:all .18s}
.soon-card:hover{border-style:solid;box-shadow:var(--shadow);transform:translateY(-2px)}

/* ═══ E-MAIL ═══ */
.mail3{display:flex;height:100%;min-height:0;overflow:hidden}
.mail-rail{width:198px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);
  overflow-y:auto;padding:12px 9px;display:flex;flex-direction:column;min-height:0}
.mail-compose-btn{width:100%;margin-bottom:14px;justify-content:center}
.mail-fold{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:var(--r-sm);
  font-size:13px;color:var(--text-2);text-align:left;transition:all .13s;margin-bottom:1px}
.mail-fold:hover{background:var(--surface-2);color:var(--text)}
.mail-fold.on{background:var(--m-soft);color:var(--m);font-weight:600}
.mail-fold svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
.mail-fold .cnt{margin-left:auto;font-size:11px;font-family:'IBM Plex Mono',monospace;
  padding:1px 6px;border-radius:20px;background:var(--surface-3);color:var(--text-3)}
.mail-fold.on .cnt{background:var(--m);color:#fff}
[data-theme="dark"] .mail-fold.on .cnt{color:#0B0E13}
.mail-fold .cnt.hot{background:var(--rose);color:#fff}
[data-theme="dark"] .mail-fold .cnt.hot{color:#0B0E13}
.mail-acc{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:var(--r-sm);
  font-size:12.5px;color:var(--text-2);width:100%;text-align:left;transition:background .13s}
.mail-acc:hover{background:var(--surface-2)}
.mail-acc .dotc{width:8px;height:8px;border-radius:2px;flex-shrink:0}

.mail-list{width:352px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);
  overflow-y:auto;overflow-x:hidden}
.mail-list-top{padding:11px 13px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;background:var(--surface)}
.mail-list-scroll{display:block}
.mail-bulk{position:sticky;bottom:0;z-index:5}
.mail-row{padding:11px 14px 12px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .12s;position:relative;display:flex;gap:11px;align-items:flex-start}
.mail-row:hover{background:var(--surface-2)}
.mail-row.on{background:var(--m-soft)}
.mail-row.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m)}
.mail-row.mail-unread .mr-from,.mail-row.mail-unread .mr-subj{font-weight:600}
.mail-row.mail-unread .mr-subj{color:var(--text)}
.mr-body{flex:1;min-width:0}
.mr-top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.mr-from{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-time{font-size:10.5px;color:var(--text-3);font-family:'IBM Plex Mono',monospace;flex-shrink:0}
.mr-subj{font-size:13px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.mr-prev{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-tags{display:flex;gap:5px;margin-top:6px;align-items:center;flex-wrap:wrap}
.mr-dot{width:8px;height:8px;border-radius:50%;background:var(--m);flex-shrink:0;margin-top:6px}
.mail-read{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
.mail-read-head{padding:16px 22px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.mail-subject{font-size:18px;font-weight:600;letter-spacing:-.025em;margin-bottom:12px;line-height:1.35}
.mail-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mail-meta{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--border)}
.mail-body{flex:1;min-height:0;overflow-y:auto;padding:22px;font-size:14px;line-height:1.65;color:var(--text-2)}
.mail-body p{margin-bottom:14px}
.mail-att{display:flex;gap:10px;padding:12px 22px;background:var(--surface-2);border-top:1px solid var(--border);flex-wrap:wrap}
.att-chip{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);font-size:12.5px;cursor:pointer;transition:all .14s}
.att-chip:hover{border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.att-ico{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.ai-sug{margin:0 22px 18px;border:1px solid var(--violet-line);border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--violet-soft),transparent 70%);overflow:hidden}
.ai-sug-head{padding:12px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--violet-line)}
.ai-sug-body{padding:14px 15px;font-size:13.5px;line-height:1.6;color:var(--text-2)}
.ai-sug-foot{padding:11px 15px;display:flex;gap:7px;align-items:center;border-top:1px solid var(--violet-line)}
.tone-chip{padding:3px 10px;border-radius:20px;font-size:11.5px;background:var(--surface);
  border:1px solid var(--border);color:var(--text-2);transition:all .13s}
.tone-chip:hover{border-color:var(--violet);color:var(--violet)}
.tone-chip.on{background:var(--violet);color:#fff;border-color:var(--violet)}
[data-theme="dark"] .tone-chip.on{color:#0B0E13}

.modal-bg{position:fixed;inset:0;background:rgba(17,23,33,.42);backdrop-filter:blur(3px);z-index:80;
  display:none;align-items:flex-end;justify-content:flex-end;padding:0}
.modal-bg.open{display:flex}
.compose{width:660px;max-width:100%;height:78vh;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;margin-right:26px;
  animation:slideUp .24s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.compose-head{padding:13px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
  background:var(--surface-2);border-radius:var(--r-lg) var(--r-lg) 0 0}
.compose-field{display:flex;align-items:center;gap:10px;padding:9px 17px;border-bottom:1px solid var(--border)}
.compose-lbl{font-size:12.5px;color:var(--text-3);width:44px;flex-shrink:0}
.compose-inp{flex:1;border:none;outline:none;background:none;font-size:13.5px;padding:2px 0}
.recip{display:inline-flex;align-items:center;gap:6px;padding:3px 5px 3px 3px;border-radius:20px;
  background:var(--surface-2);font-size:12.5px;margin-right:5px}
.recip button{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;color:var(--text-3)}
.recip button:hover{background:var(--surface-3);color:var(--text)}
.compose-body{flex:1;padding:17px;overflow-y:auto;font-size:14px;line-height:1.65;outline:none}
.compose-sig{padding:14px 17px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-3);line-height:1.6}
.compose-foot{padding:12px 17px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--surface-2)}


/* ═══ FOLLOW-UP COCKPIT ═══ */
.fu-split{display:flex;height:100%;min-height:0;overflow:hidden}
.fu-list{width:352px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);
  overflow-y:auto;overflow-x:hidden}
.fu-list-top{padding:11px 13px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:6;background:var(--surface)}
.fu-bucket{padding:9px 14px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);background:var(--surface-2);border-bottom:1px solid var(--border);
  position:sticky;top:78px;z-index:5;display:flex;align-items:center;gap:7px}
.fu-bucket .c{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;
  background:var(--surface);padding:1px 7px;border-radius:20px}
.fu-row{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:11px;
  align-items:flex-start;transition:background .12s;position:relative}
.fu-row:hover{background:var(--surface-2)}
.fu-row.on{background:var(--m-soft)}
.fu-row.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m)}
.fu-row-b{flex:1;min-width:0}
.fu-name{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fu-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.fu-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;align-items:center}
.fu-when{font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--text-3);flex-shrink:0;text-align:right}
.fu-hot{color:var(--rose)}
.fu-card{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
.fu-card-scroll{flex:1;min-height:0;overflow-y:auto}
.fu-hero{padding:20px 22px 18px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.fu-hero::before{content:'';position:absolute;top:0;right:0;width:320px;height:100%;
  background:linear-gradient(250deg,var(--m-soft),transparent 72%);pointer-events:none}
.fu-hero-top{display:flex;align-items:flex-start;gap:15px;position:relative}
.fu-num{font-size:19px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-.02em}
.dial{display:flex;gap:8px;align-items:center;margin-top:14px;position:relative;flex-wrap:wrap}
.btn-call{background:var(--emerald);color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;
  font-weight:600;display:inline-flex;align-items:center;gap:9px;box-shadow:0 3px 14px -3px rgba(7,131,90,.55);
  transition:all .16s}
.btn-call:hover{filter:brightness(1.08);transform:translateY(-1px)}
[data-theme="dark"] .btn-call{color:#0B0E13}
.fu-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.fu-info-c{background:var(--surface);padding:12px 16px}
.fu-info-l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:4px}
.fu-info-v{font-size:13.5px;font-weight:500}
.oc-panel{margin:16px 22px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.oc-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.oc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:14px 16px}
.oc-btn{padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);
  text-align:left;transition:all .14s;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500}
.oc-btn:hover{border-color:var(--oc);background:var(--oc-soft);transform:translateY(-1px)}
.oc-btn.on{border-color:var(--oc);background:var(--oc-soft);color:var(--oc)}
.oc-btn .i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;
  background:var(--oc-soft);color:var(--oc)}
.oc-btn.on .i{background:var(--oc);color:#fff}
[data-theme="dark"] .oc-btn.on .i{color:#0B0E13}
.oc-btn .i svg{width:13px;height:13px}
.oc-more{border-top:1px solid var(--border);padding:14px 16px}
.oc-lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:9px}
.warm{display:flex;gap:4px;align-items:center}
.warm i{flex:1;height:8px;border-radius:3px;background:var(--surface-3);cursor:pointer;transition:all .14s}
.warm i:hover{transform:scaleY(1.4)}
.warm i.on{background:var(--warmc)}
.obj-chip{padding:5px 11px;border-radius:20px;font-size:12px;background:var(--surface-2);
  border:1px solid transparent;color:var(--text-2);transition:all .13s}
.obj-chip:hover{background:var(--surface-3)}
.obj-chip.on{background:var(--rose-soft);border-color:var(--rose-line);color:var(--rose);font-weight:500}
.callbar{position:fixed;right:24px;bottom:24px;width:296px;background:var(--text);color:var(--bg);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:90;padding:15px 17px;
  animation:slideUp .22s cubic-bezier(.32,.72,0,1)}
[data-theme="dark"] .callbar{background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong)}
.callbar-top{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.pulse{width:9px;height:9px;border-radius:50%;background:#4ADE80;flex-shrink:0;
  box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.callbar-acts{display:flex;gap:8px}
.cb-btn{flex:1;padding:8px;border-radius:var(--r-sm);background:rgba(255,255,255,.14);
  display:grid;place-items:center;transition:background .14s}
.cb-btn:hover{background:rgba(255,255,255,.24)}
[data-theme="dark"] .cb-btn{background:var(--surface)}
.cb-btn.end{background:#DC2626;color:#fff}
.cb-btn svg{width:16px;height:16px}
.fu-tl{padding:0 22px 22px}


/* ═══ CENTRALE INBOX ═══ */
.ib-split{display:flex;height:100%;min-height:0;overflow:hidden}
.ib-rail{width:216px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);
  overflow-y:auto;padding:12px 9px}
.ib-src{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:var(--r-sm);
  font-size:13px;color:var(--text-2);text-align:left;transition:all .13s;margin-bottom:2px}
.ib-src:hover{background:var(--surface-2);color:var(--text)}
.ib-src.on{background:var(--m-soft);color:var(--m);font-weight:600}
.ib-src .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.ib-src .ic svg{width:14px;height:14px}
.ib-src .n{margin-left:auto;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;
  padding:1px 7px;border-radius:20px;background:var(--rose);color:#fff}
[data-theme="dark"] .ib-src .n{color:#0B0E13}
.ib-src .n.zero{background:var(--surface-3);color:var(--text-3)}
.ib-list{width:378px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);overflow-y:auto}
.ib-top{padding:11px 13px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:6;background:var(--surface)}
.ib-row{padding:12px 15px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:11px;
  align-items:flex-start;transition:background .12s;position:relative}
.ib-row:hover{background:var(--surface-2)}
.ib-row.on{background:var(--m-soft)}
.ib-row.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m)}
.ib-row.nw .ib-t{font-weight:600;color:var(--text)}
.ib-b{flex:1;min-width:0}
.ib-t{font-size:13.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-p{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.ib-src-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:1.5px 8px;
  border-radius:20px;font-weight:600}
.ib-detail{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);overflow:hidden}


/* ═══ EVENT DETAIL + AFRONDEN ═══ */
.ev-head{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 22px 0;position:relative;overflow:hidden}
.ev-head::before{content:'';position:absolute;top:0;right:0;width:360px;height:100%;
  background:linear-gradient(250deg,var(--m-soft),transparent 72%);pointer-events:none}
.ev-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);margin-bottom:12px;transition:color .13s}
.ev-back:hover{color:var(--text)}
.ev-back svg{width:14px;height:14px}
.ev-title{font-size:22px;font-weight:600;letter-spacing:-.03em}
.ev-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text-3);margin-top:6px}
.ev-stats{display:flex;margin-top:18px;flex-wrap:wrap}
.ev-stat{padding-right:26px;margin-right:26px;border-right:1px solid var(--border)}
.ev-stat:last-child{border-right:none}
.seat{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:8px;width:180px}
.seat i{display:block;height:100%;border-radius:4px;background:var(--m)}

.mdl{position:fixed;inset:0;background:rgba(17,23,33,.5);backdrop-filter:blur(3px);z-index:95;
  display:none;align-items:center;justify-content:center;padding:26px}
.mdl.open{display:flex}
.mdl-box{width:920px;max-width:100%;max-height:88vh;background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:pop .22s cubic-bezier(.32,.72,0,1)}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.mdl-head{padding:17px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.mdl-body{flex:1;min-height:0;overflow-y:auto}
.mdl-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:9px;align-items:center;background:var(--surface-2);
  border-radius:0 0 var(--r-lg) var(--r-lg)}
.att-block{padding:14px 22px;border-bottom:1px solid var(--border)}
.att-top{display:flex;align-items:center;gap:12px}
.radio-grp{display:flex;gap:6px}
.radio-b{padding:6px 13px;border-radius:20px;font-size:12.5px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-2);transition:all .13s}
.radio-b:hover{border-color:var(--border-strong)}
.radio-b.on{border-color:var(--rb);background:var(--rb-soft);color:var(--rb);font-weight:600}
.att-extra{margin-top:12px;padding:13px 15px;background:var(--surface-2);border-radius:var(--r);
  display:flex;gap:11px;flex-wrap:wrap;align-items:flex-start}
.exp-row{display:grid;grid-template-columns:1fr 130px 130px 34px;gap:9px;margin-bottom:8px;align-items:center}


/* ═══ AUTOMATISERINGEN ═══ */
.au-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow-xs);transition:all .18s;cursor:pointer}
.au-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.au-top{padding:15px 17px;display:flex;align-items:flex-start;gap:12px}
.au-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border)}
.au-stat{background:var(--surface);padding:10px 12px;text-align:center}
.au-stat-v{font-size:17px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-.03em}
.au-stat-l{font-size:10px;letter-spacing:.05em;color:var(--text-3);margin-top:2px}
.au-lock{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 8px;
  border-radius:20px;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.flow{display:flex;flex-direction:column;gap:0;padding:4px 0}
.flow-step{display:flex;gap:13px;position:relative;padding-bottom:14px}
.flow-step:last-child{padding-bottom:0}
.flow-step::before{content:'';position:absolute;left:16px;top:34px;bottom:-2px;width:2px;background:var(--border)}
.flow-step:last-child::before{display:none}
.flow-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:var(--fc-soft);color:var(--fc);border:1.5px solid var(--fc-line);z-index:1}
.flow-ico svg{width:15px;height:15px}
.flow-b{flex:1;min-width:0;padding-top:3px}
.flow-t{font-size:13.5px;font-weight:500}
.flow-s{font-size:12px;color:var(--text-3);margin-top:2px}
.cron-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px}
.cron-row:last-child{border-bottom:none}
.cron-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}


/* ═══ TOOLTIP ═══ */
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:7px;transition:background .13s;cursor:default}
.tip:hover{background:var(--surface-3)}
.tip svg{width:15px;height:15px}
.tip-box{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  background:var(--text);color:var(--bg);padding:9px 12px;border-radius:9px;font-size:12px;line-height:1.5;
  white-space:nowrap;opacity:0;pointer-events:none;transition:all .16s;z-index:60;box-shadow:var(--shadow-lg);
  font-weight:400;text-align:left}
[data-theme="dark"] .tip-box{background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong)}
.tip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--text)}
[data-theme="dark"] .tip-box::after{border-top-color:var(--surface-3)}
.tip:hover .tip-box{opacity:1;transform:translateX(-50%) translateY(0)}
.tip-t{font-weight:600;margin-bottom:3px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;opacity:.65}


/* ═══ COMPACTE TABEL ═══ */
.tbl-compact thead th{padding:8px 9px;font-size:9.5px;letter-spacing:.05em}
.tbl-compact tbody td{padding:7px 9px;font-size:12.5px}
.tbl-compact .cell-main{font-size:12.5px}
.tbl-compact .cell-sub{font-size:10.5px}
.tbl-compact .pill{font-size:10.5px;padding:1.5px 7px}
.tbl-compact .pill::before{width:4px;height:4px}
.tbl-compact .icon-btn{width:24px;height:24px}
.tbl-compact .icon-btn svg{width:14px;height:14px}
.tbl-compact .checkbox{width:14px;height:14px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

@keyframes draw{to{stroke-dashoffset:0}}

/* ═══════════════ MOBIEL ═══════════════ */
.mob-btn{display:none;width:34px;height:34px;border-radius:var(--r-sm);align-items:center;justify-content:center;
  color:var(--text-2);flex-shrink:0;margin-right:-4px}
.mob-btn:hover{background:var(--surface-2)}
.mob-btn svg{width:19px;height:19px}
.scrim{position:fixed;inset:0;background:rgba(17,23,33,.45);backdrop-filter:blur(2px);z-index:44;
  opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.mob-back{display:none;align-items:center;gap:7px;padding:10px 15px;border-bottom:1px solid var(--border);
  background:var(--surface);font-size:13px;font-weight:500;color:var(--m);width:100%;position:sticky;top:0;z-index:8}
.mob-back svg{width:15px;height:15px}

  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:46;width:270px;

  .sidebar.open{transform:translateX(0)}
  .mob-btn{display:flex}
  .main{margin-right:0 !important}
  .topbar{padding:0 14px;gap:10px;height:52px}
  .page-title{font-size:15px;min-width:0;overflow:hidden}
  .page-title .crumb-sep,.page-title .crumb-cur{display:none}
  .searchbox{width:auto;flex:1;max-width:none}
  .searchbox input{padding:7px 12px 7px 30px}
  .searchbox .kbd{display:none}
  .tabs{padding:0 10px}
  .tab{padding:10px 10px 11px;font-size:13px}

  .panel{width:100vw;border-left:none}
  .panel-head{padding:14px 16px 12px}
  .panel-foot{padding:11px 16px;flex-wrap:wrap}
  .panel-foot .btn{flex:1;justify-content:center;min-width:120px}

  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:9px}

  .toolbar{padding:10px 14px;gap:6px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .toolbar::-webkit-scrollbar{height:0}
  .toolbar>*{flex-shrink:0}

  .tb-search{width:180px}

  thead th{position:static}

  /* Tweeluiken worden gestapeld */
  .chat-split,.mail3,.fu-split,.ib-split,.set-split{flex-direction:column;height:auto;min-height:100%}
  .chat-list,.mail-list,.fu-list,.ib-list{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
  .mail-rail,.ib-rail,.set-nav{width:100%;max-height:none;border-right:none;border-bottom:1px solid var(--border);
    display:flex;flex-direction:row;gap:6px;overflow-x:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}

  .chat-head,.mail-read-head{padding:11px 14px;flex-wrap:wrap;gap:8px}
  .chat-msgs,.mail-body{padding:14px}
  .msg{max-width:88% !important}
  .chat-compose,.mail-att{padding:11px 14px}
  .compose-acts{flex-wrap:wrap}

  .ai-sug-foot{flex-wrap:wrap}

  /* Dossier + event */
  .dossier-head,.ev-head,.fu-hero{padding:16px 14px 14px}
  .dossier-head::before,.ev-head::before,.fu-hero::before{display:none}
  .dossier-top,.ev-head>div,.fu-hero-top{flex-wrap:wrap}
  .dossier-name,.ev-title{font-size:18px}
  .avatar-lg{width:44px;height:44px;font-size:16px}
  .stat-row,.ev-stats{gap:0}
  .stat,.ev-stat{padding-right:16px;margin-right:16px;margin-bottom:10px}
  .stat-v,.ev-stat .stat-v{font-size:16px}

  /* Instellingen */
  .set-body{min-height:auto}
  .field{flex-direction:column;gap:8px;padding:13px 14px}
  .field-l{width:100%}
  .inp{max-width:none !important}

  /* Modals */
  .mdl{padding:0;align-items:flex-end}

  .mdl-head,.mdl-foot{padding:14px 16px}
  .mdl-foot{flex-wrap:wrap}
  .mdl-foot .btn{flex:1;justify-content:center}
  .att-block{padding:13px 16px}
  .att-top{flex-wrap:wrap}
  .radio-grp{width:100%;margin-top:8px}
  .radio-b{flex:1;text-align:center;justify-content:center}
  .exp-row{grid-template-columns:1fr;gap:6px}
  .compose{width:100%;height:88vh;margin-right:0;border-radius:var(--r-lg) var(--r-lg) 0 0}
  .modal-bg{padding:0}

  /* Uitkomst-paneel follow-up */

  .oc-grid{grid-template-columns:repeat(2,1fr);padding:12px 13px;gap:7px}
  .oc-btn{padding:9px 10px;font-size:12px}
  .fu-tl{padding:0 14px 16px}
  .fu-info{grid-template-columns:repeat(2,1fr)}

  /* Overig */
  .callbar{right:12px;left:12px;width:auto;bottom:12px}
  .cal{margin:14px;font-size:11px}
  .cal-d{min-height:64px;padding:5px}
  .kanban{padding:14px;gap:10px}

}

/* ═══════════════ MOBIEL — inline-layout fixes ═══════════════ */
/* Veel custom views (o.a. het manager-dashboard) zetten hun layout in een
   inline style="grid-template-columns:…". Media-queries op classes raken die
   niet, dus overschrijven we de inline waarden hier expliciet met !important. */
@media (max-width:760px){
  /* Grote twee-koloms / twee-paneel layouts stapelen:
     manager-dashboard (1.55fr 1fr), event-detail (1fr 1.4fr), Lisa-detail (1fr 1fr),
     leadsonderhoud (300px 1fr · 1fr 340px), mentoren/detail (1fr 320px) */
  #content [style*="grid-template-columns:1.55fr"],
  #content [style*="grid-template-columns:1fr 1.4fr"],
  #content [style*="grid-template-columns:1fr 1fr"],
  #content [style*="grid-template-columns:300px 1fr"],
  #content [style*="grid-template-columns:1fr 340px"],
  #content [style*="grid-template-columns:1fr 320px"]{
    grid-template-columns:1fr !important;
  }
  /* Vier-koloms tegelrijen (dashboard-KPI's, motor-stats) → twee kolommen */
  #content [style*="grid-template-columns:repeat(4,1fr)"]{
    grid-template-columns:repeat(2,1fr) !important;
  }
  /* Brede flex-rij zonder wrap (eerstkomende events op dashboard) mag afbreken */
  #content button[style*="gap:22px"]{
    flex-wrap:wrap;gap:12px !important;
  }
  /* Autonomie-tabel (AI Agents): smallere modus-kolommen zodat het past */
  #content [style*="1fr repeat(4,86px)"]{

function applyColor(){

function toggleNav(force){
  const sb=document.querySelector('.sidebar'),sc=document.getElementById('scrim');

function goMod(id){
  const m=MODS.find(x=>x.id===id);
  if(window.innerWidth<=900)toggleNav(false);
  if(m.ext){alert('Opent de externe leeromgeving:\n'+m.ext+'\n\n(In het echte systeem opent dit in een nieuw tabblad.)');return}
  S.mod=id;S.dossier=null;taakOpen=false;waTplOpen=false;closePanel(true);S.tab=roleTabs(m)[0]||'';render()}
function goTab(t){S.tab=t;S.dossier=null;taakOpen=false;waTplOpen=false;closePanel(true);render()}

function render(){
  applyColor();renderNav();
  const m=curMod();
  const tabs=roleTabs(m);
  /* Val terug op de eerste toegestane tab als de huidige niet mag (bv. na rolwissel) */
  if(!S.dossier&&m.tabs.length&&!tabs.includes(S.tab))S.tab=tabs[0]||'';
  document.getElementById('crumb').innerHTML=S.dossier
    ?`<span class="title-dot"></span><span style="cursor:pointer;color:var(--text-3);font-weight:500" onclick="S.dossier=null;render()">${m.naam}</span><span class="crumb-sep">/</span><span>${S.dossier}</span>`
    :`<span class="title-dot"></span>${m.naam}${tabs.length>1?`<span class="crumb-sep">/</span><span class="crumb-cur">${S.tab}</span>`:''}`;
  const locked=modLocked(m.id);
  const tb=document.getElementById('tabs');
  tb.style.display=(tabs.length>1&&!S.dossier&&!locked)?'flex':'none';
  tb.innerHTML=tabs.map(t=>`<button class="tab ${S.tab===t?'active':''}" onclick="goTab('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('');
  const c=document.getElementById('content');
  c.innerHTML=(locked?comingSoonView(m):(S.dossier?viewDossier():(VIEWS[S.mod+'/'+S.tab]||VIEWS[S.mod+'/']||genericView)()))
    +(typeof softphoneBar==='function'?softphoneBar():'')
    +(typeof taakModal==='function'&&taakOpen?taakModal():'')
    +(typeof waTplModal==='function'&&waTplOpen?waTplModal():'');
  const sk=key();
  requestAnimationFrame(()=>{c.scrollTop=S.scroll[sk]||0});
  c.onscroll=()=>{S.scroll[sk]=c.scrollTop};
}

function areaChart(data,labels){
  const w=100,h=42,mx=Math.max(...data);
  const pts=data.map((v,i)=>[i/(data.length-1)*w,h-(v/mx)*h*.88-2]);
  const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="gradA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--m)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--m)" stop-opacity="0"/>
    </linearGradient></defs>
    <g class="chart-grid">${[0,.33,.66,1].map(f=>`<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}"/>`).join('')}</g>
    <path class="chart-area" d="${line} L${w},${h} L0,${h} Z"/>
    <path class="chart-line" d="${line}" vector-effect="non-scaling-stroke"/>
    <circle class="chart-dot" cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="1.6" vector-effect="non-scaling-stroke"/>
  </svg><div class="chart-x">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`;
}

/* Interactieve dubbele-lijn grafiek met hover */
function dualChart(id,serieA,serieB,labels,labelA,labelB,colA,colB){
  const w=560,h=170,pl=8,pr=8,pt=14,pb=26;
  const all=[...serieA,...serieB],mx=Math.max(...all)*1.12;
  const X=i=>pl+(i/(labels.length-1))*(w-pl-pr);
  const Y=v=>pt+(1-v/mx)*(h-pt-pb);
  const path=s=>s.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area=s=>`${path(s)} L${X(s.length-1)},${h-pb} L${pl},${h-pb} Z`;
  return `<div style="position:relative" id="${id}-wrap">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:190px;display:block;overflow:visible"
      onmousemove="chartHover(event,'${id}',${labels.length},${pl},${w-pr})" onmouseleave="chartOut('${id}')">
      <defs>
        <linearGradient id="${id}-gA" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--${colA})" stop-opacity=".20"/><stop offset="100%" stop-color="var(--${colA})" stop-opacity="0"/></linearGradient>
        <linearGradient id="${id}-gB" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--${colB})" stop-opacity=".16"/><stop offset="100%" stop-color="var(--${colB})" stop-opacity="0"/></linearGradient>
      </defs>
      ${[0,.25,.5,.75,1].map(f=>`<line x1="${pl}" y1="${(pt+f*(h-pt-pb)).toFixed(1)}" x2="${w-pr}" y2="${(pt+f*(h-pt-pb)).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`).join('')}
      <path d="${area(serieB)}" fill="url(#${id}-gB)"/>
      <path d="${area(serieA)}" fill="url(#${id}-gA)"/>
      <path d="${path(serieB)}" fill="none" stroke="var(--${colB})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s .1s ease-out forwards"/>
      <path d="${path(serieA)}" fill="none" stroke="var(--${colA})" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s ease-out forwards"/>
      <line id="${id}-vline" x1="0" y1="${pt}" x2="0" y2="${h-pb}" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      ${serieA.map((v,i)=>`<circle id="${id}-dA${i}" cx="${X(i)}" cy="${Y(v)}" r="3.6" fill="var(--surface)" stroke="var(--${colA})" stroke-width="2.2" opacity="0" style="transition:opacity .12s"/>`).join('')}
      ${serieB.map((v,i)=>`<circle id="${id}-dB${i}" cx="${X(i)}" cy="${Y(v)}" r="3.6" fill="var(--surface)" stroke="var(--${colB})" stroke-width="2.2" opacity="0" style="transition:opacity .12s"/>`).join('')}
      ${labels.map((l,i)=>`<text x="${X(i)}" y="${h-7}" text-anchor="middle" font-size="10.5" fill="var(--text-3)" font-family="IBM Plex Mono">${l}</text>`).join('')}
    </svg>
    <div id="${id}-tip" style="position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5;
      background:var(--text);color:var(--bg);border-radius:9px;padding:9px 12px;font-size:12px;box-shadow:var(--shadow-lg);white-space:nowrap"></div>
    <div style="display:flex;gap:18px;margin-top:6px;font-size:11.5px;color:var(--text-3)">
      <span style="display:flex;align-items:center;gap:6px"><span class="legend-dot" style="background:var(--${colA})"></span>${labelA}</span>
      <span style="display:flex;align-items:center;gap:6px"><span class="legend-dot" style="background:var(--${colB})"></span>${labelB}</span></div>
  </div>`;
}
const CHARTDATA={};
function chartHover(e,id,n,pl,pr){
  const svgEl=e.currentTarget,r=svgEl.getBoundingClientRect();
  const vb=560,x=(e.clientX-r.left)/r.width*vb;
  let i=Math.round((x-pl)/((pr-pl)/(n-1)));i=Math.max(0,Math.min(n-1,i));
  const d=CHARTDATA[id];if(!d)return;
  const line=document.getElementById(id+'-vline');
  const cx=pl+(i/(n-1))*(pr-pl);
  line.setAttribute('x1',cx);line.setAttribute('x2',cx);line.style.opacity='1';
  for(let k=0;k<n;k++){
    const a=document.getElementById(id+'-dA'+k),b=document.getElementById(id+'-dB'+k);
    if(a)a.style.opacity=k===i?'1':'0';if(b)b.style.opacity=k===i?'1':'0';
  }
  const tip=document.getElementById(id+'-tip');
  tip.innerHTML=`<div style="font-weight:600;margin-bottom:5px;opacity:.7;font-size:11px">${d.labels[i]}</div>
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
      <span style="width:7px;height:7px;border-radius:2px;background:var(--${d.colA})"></span>
      <span style="opacity:.75">${d.labelA}</span>
      <b style="margin-left:auto;font-family:'IBM Plex Mono',monospace">${eur0(d.a[i])}</b></div>
    <div style="display:flex;align-items:center;gap:7px">
      <span style="width:7px;height:7px;border-radius:2px;background:var(--${d.colB})"></span>
      <span style="opacity:.75">${d.labelB}</span>
      <b style="margin-left:auto;font-family:'IBM Plex Mono',monospace">${eur0(d.b[i])}</b></div>`;
  tip.style.opacity='1';
  const px=cx/vb*r.width;
  tip.style.left=Math.min(Math.max(px-72,0),r.width-165)+'px';
  tip.style.top='6px';
}
function chartOut(id){
  const l=document.getElementById(id+'-vline');if(l)l.style.opacity='0';
  const t=document.getElementById(id+'-tip');if(t)t.style.opacity='0';
  document.querySelectorAll(`[id^="${id}-dA"],[id^="${id}-dB"]`).forEach(c=>c.style.opacity='0');
}

const funnel=stages=>{const mx=stages[0][1];return `<div style="padding:2px 0">${stages.map(([l,v],i)=>{
  const w=Math.round(v/mx*100),conv=i>0?Math.round(v/stages[i-1][1]*100):100;
  return `<div style="margin-bottom:${i<stages.length-1?'13px':'0'}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px">

    <div style="height:24px;background:var(--surface-2);border-radius:7px;overflow:hidden">
      <div style="height:100%;width:${w}%;background:linear-gradient(90deg,var(--m),color-mix(in srgb,var(--m) 55%,var(--surface)));border-radius:7px;transition:width .6s cubic-bezier(.32,.72,0,1)"></div></div>

function uploadCert(){const naam=(document.getElementById('certNaam').value||'').trim(),uitg=document.getElementById('certUitg').value,f=document.getElementById('certFile').files[0];

  else{alert('Certificaat downloaden: '+c.bestand+'\n\n(In het echte systeem wordt het geüploade bestand gedownload.)');}}

function toggleTaakDone(id){const t=TAKEN.find(x=>x.id===id);if(t){t.status=t.status==='klaar'?'todo':'klaar';render();}}
function refreshTaak(t){render();const i=(S.rows||[]).indexOf(t);if(i>=0){S.selIdx=i;openPanel(t.titel,`${t.van}${t.klant?' · '+t.klant:''}`,taakPanelBody(t),taakPanelFoot(t));}}
function setTaakStatus(id,st){const t=TAKEN.find(x=>x.id===id);if(t){t.status=st;refreshTaak(t);}}
function taakRemoveCC(id,n){const t=TAKEN.find(x=>x.id===id);if(t){t.cc=t.cc.filter(c=>c!==n);refreshTaak(t);}}
function taakAddCCPrompt(id){const t=TAKEN.find(x=>x.id===id);if(!t)return;const opts=TEAM.filter(n=>n!==t.eigenaar&&!t.cc.includes(n));if(!opts.length){alert('Iedereen volgt al mee.');return;}const n=prompt('Wie wil je als volger (CC) toevoegen?\n'+opts.join(', '),opts[0]);if(n&&opts.includes(n)){t.cc.push(n);refreshTaak(t);}}
function openTaak(i){const t=S.rows[i];if(!t)return;S.selIdx=i;openPanel(t.titel,`${t.van}${t.klant?' · '+t.klant:''}`,taakPanelBody(t),taakPanelFoot(t));}
const taakPanelBody=t=>`
  <div style="display:flex;gap:6px;margin:2px 0 16px">
    ${[['todo','Te doen'],['bezig','Bezig'],['klaar','Klaar']].map(([v,l])=>`<button class="chip ${t.status===v?'on':''}" style="flex:1;justify-content:center;padding:8px" onclick="setTaakStatus(${t.id},'${v}')">${l}</button>`).join('')}</div>
  ${t.oms?`<div class="sect"><div class="sect-title">Omschrijving</div><div style="font-size:13px;color:var(--text-2);line-height:1.55">${t.oms}</div></div>`:''}
  <div class="sect"><div class="sect-title">Betrokkenen</div>
    <div style="display:flex;align-items:center;gap:10px;padding:7px 0">${av(t.eigenaar,30)}
      <div style="flex:1"><div style="font-size:13px;font-weight:600">${t.eigenaar}</div><div style="font-size:11.5px;color:var(--text-3)">Verantwoordelijk</div></div></div>
    ${t.cc.map(n=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0">${av(n,30)}
      <div style="flex:1"><div style="font-size:13px;font-weight:500">${n}</div><div style="font-size:11.5px;color:var(--text-3)">Volgt mee (CC)</div></div>
      <button class="icon-btn" title="Verwijderen" onclick="taakRemoveCC(${t.id},'${n}')">${svg(I.x,'width:14px;height:14px')}</button></div>`).join('')}
    <button class="btn btn-ghost btn-sm" style="margin-top:7px" onclick="taakAddCCPrompt(${t.id})">${svg(I.plus)}Volger toevoegen</button></div>
  <div class="sect"><div class="sect-title">Gegevens</div>
    <div class="kv"><dt>Bron</dt><dd>${pill('neutral',t.van)}</dd></div>
    ${t.klant?`<div class="kv"><dt>Klant</dt><dd>${t.klant}</dd></div>`:''}
    <div class="kv"><dt>Deadline</dt><dd class="num">${t.deadline}</dd></div>
    <div class="kv"><dt>Prioriteit</dt><dd>${prioPill(t.prio)}</dd></div></div>
  <div class="sect"><div class="sect-title">Bijlagen</div>${taakBijlagen(t.bijlagen,false)}</div>
  <div class="sect"><div class="sect-title">Activiteit</div>
    <div class="timeline">
      <div class="tl-item hi"><div class="tl-when">Nu</div><div class="tl-what">Status staat op <b>${t.status==='klaar'?'Klaar':t.status==='bezig'?'Bezig':'Te doen'}</b></div></div>
      <div class="tl-item"><div class="tl-when">Vandaag 08:30</div><div class="tl-what">${t.eigenaar} maakte de taak aan${t.cc.length?` en zette ${t.cc.join(', ')} op CC`:''}</div></div></div>
    <input class="inp" style="max-width:none;margin-top:10px" placeholder="Reactie toevoegen…"></div>`;
const taakPanelFoot=t=>`<button class="btn btn-ghost" style="flex:1;justify-content:center">${svg(I.edit)}Bewerken</button>
  <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="setTaakStatus(${t.id},'${t.status==='klaar'?'todo':'klaar'}')">${svg(I.tick)}${t.status==='klaar'?'Heropenen':'Afronden'}</button>`;

/* Nieuwe-taak modal (met CC-volgers en bijlagen) */
let taakOpen=false,taakDraft=null;
function openTaakModal(){taakDraft={titel:'',oms:'',eigenaar:me(),cc:[],deadline:'',prio:'midden',van:'Sales',klant:'',bijlagen:[]};taakOpen=true;render();}
function closeTaakModal(){taakOpen=false;render();}
function toggleTaakCC(n){const i=taakDraft.cc.indexOf(n);if(i>=0)taakDraft.cc.splice(i,1);else taakDraft.cc.push(n);render();}
function addTaakBijlage(e){const f=e.target.files[0];if(!f)return;if(f.type.startsWith('image')){const r=new FileReader();r.onload=()=>{taakDraft.bijlagen.push({t:'afbeelding',n:f.name,url:r.result});render();};r.readAsDataURL(f);}else{taakDraft.bijlagen.push({t:'video',n:f.name,url:''});render();}}
function removeTaakBijlage(i){taakDraft.bijlagen.splice(i,1);render();}
function createTaak(){if(!taakDraft.titel.trim()){alert('Geef de taak een titel.');return;}TAKEN.unshift({id:taakSeq++,titel:taakDraft.titel,oms:taakDraft.oms,van:taakDraft.van,klant:taakDraft.klant,deadline:taakDraft.deadline||'—',prio:taakDraft.prio,status:'todo',eigenaar:taakDraft.eigenaar,cc:taakDraft.cc.slice(),bijlagen:taakDraft.bijlagen.slice()});taakOpen=false;render();}
