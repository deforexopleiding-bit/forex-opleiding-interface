<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wanbetalers — diagnostisch overzicht</title>
  <link rel="stylesheet" href="/modules/shared/agent-shared.css" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .app{margin-left:220px;padding:16px 16px 60px;max-width:1400px}
    .page-head h1{font-size:22px;font-weight:800}
    .sub{color:var(--text-dim);font-size:12.5px;margin-top:2px}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface,var(--bg));padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin:14px 0 12px;position:sticky;top:8px;z-index:20}
    .toolbar input,.toolbar select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;font-family:inherit;background:var(--bg);color:var(--text)}
    .toolbar input[type=search]{flex:1;min-width:200px}
    .tabs{display:flex;gap:6px}
    .tab{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit}
    .tab.active{background:#0f766e;color:#fff;border-color:#0f766e}
    .btn-dl{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit}
    .btn-dl:hover:not(:disabled){background:var(--surface-2,rgba(0,0,0,.04))}
    .btn-dl:disabled{opacity:.6;cursor:not-allowed}
    .btn-dl.active{background:#4338ca;color:#fff;border-color:#4338ca}
    .stats{display:flex;gap:8px;font-size:12px;color:var(--text-dim);flex-wrap:wrap}
    .stats button{background:rgba(99,102,241,.14);color:#4338ca;padding:2px 7px;border-radius:5px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:inherit;font-size:12px}
    .stats button:hover{background:rgba(99,102,241,.24)}
    .stats button.active{background:#4338ca;color:#fff;border-color:#4338ca}
    .stats .clear{background:transparent;color:var(--text-dim);border:1px dashed var(--border);font-weight:500}
    .stats .clear:hover{background:var(--surface-2,rgba(0,0,0,.04))}
    /* Paused-blok bovenaan */
    .paused-section{background:var(--surface,var(--bg));border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px}
    .paused-section h2{font-size:14px;font-weight:700;margin-bottom:8px;color:#92400e}
    .paused-section h2 .cnt{background:rgba(245,158,11,.18);color:#92400e;padding:2px 8px;border-radius:5px;font-size:12px;margin-left:6px}
    .paused-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--border-soft,rgba(0,0,0,.05));font-size:12.5px}
    .paused-row:last-child{border-bottom:none}
    .paused-row .pnaam{font-weight:600}
    .paused-row .preden{color:var(--text-dim);font-size:12px}
    .paused-row .popen{font-variant-numeric:tabular-nums;font-weight:600}
    .paused-row .b-verlopen{background:rgba(220,38,38,.14);color:#b91c1c;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600}
    .era-hist{background:rgba(107,114,128,.15);color:#4b5563;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;margin-left:6px}
    .era-act{background:rgba(220,38,38,.14);color:#b91c1c;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;margin-left:6px}
    /* AI-analyse blok */
    .ai-block{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;background:var(--bg)}
    .ai-block h4{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
    .ai-btn{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
    .ai-btn:hover:not(:disabled){background:var(--surface-2,rgba(0,0,0,.04))}
    .ai-btn:disabled{opacity:.5;cursor:not-allowed}
    .ai-result{margin-top:8px;font-size:12.5px}
    .ai-verdict-ja{background:rgba(245,158,11,.18);color:#92400e;padding:2px 8px;border-radius:4px;font-weight:700}
    .ai-verdict-nee{background:rgba(107,114,128,.15);color:#4b5563;padding:2px 8px;border-radius:4px;font-weight:700}
    .ai-verdict-onduidelijk{background:rgba(99,102,241,.14);color:#3730a3;padding:2px 8px;border-radius:4px;font-weight:700}
    /* Verplaats-tool modal */
    .mv-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
    .mv-modal.show{display:flex}
    .mv-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px 22px;max-width:720px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto}
    .mv-card h3{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .mv-card label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.3px}
    .mv-card select,.mv-card input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;font-size:14px}
    .mv-card .mv-check{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:10px;border:1px solid var(--border);border-radius:6px;margin-top:8px;cursor:pointer}
    .mv-card .mv-check input{margin-top:2px}
    .mv-preview{margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2,rgba(0,0,0,.03));font-size:12.5px;line-height:1.5;font-family:'SF Mono',Consolas,monospace;white-space:pre-wrap}
    .mv-warn-real{background:rgba(220,38,38,.12);color:#b91c1c;padding:8px 10px;border-radius:6px;margin-top:10px;font-weight:600;font-size:13px;border:1px solid rgba(220,38,38,.35)}
    .mv-warn-live{background:rgba(220,38,38,.18);color:#b91c1c;padding:10px 12px;border-radius:6px;margin-top:10px;font-weight:700;font-size:13.5px;border:2px solid rgba(220,38,38,.6)}
    .mv-warn-note{background:rgba(245,158,11,.14);color:#92400e;padding:6px 10px;border-radius:6px;margin-top:6px;font-size:12.5px}
    .mv-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .mv-btn{padding:7px 14px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
    .mv-btn:hover:not(:disabled){background:var(--surface-2,rgba(0,0,0,.04))}
    .mv-btn:disabled{opacity:.5;cursor:not-allowed}
    .mv-btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}
    .mv-btn-danger:hover:not(:disabled){background:#b91c1c}
    .mv-btn-primary{background:#0f766e;color:#fff;border-color:#0f766e}
    .mv-btn-primary:hover:not(:disabled){background:#115e59}
    .mv-tpl-preview{margin-top:8px;padding:10px;border:1px dashed var(--border);border-radius:6px;background:var(--bg);max-height:220px;overflow-y:auto;font-family:'SF Mono',Consolas,monospace;font-size:12px;white-space:pre-wrap}
    .mv-pa-list{margin-top:6px;padding-left:18px;font-size:12.5px}
    .cust{background:var(--surface,var(--bg));border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
    .cust-head{display:grid;grid-template-columns:1fr auto auto auto 20px;gap:14px;align-items:center;padding:10px 14px;cursor:pointer;user-select:none}
    .cust-head:hover{background:var(--surface-2,rgba(0,0,0,.03))}
    .cust-name{font-weight:700;font-size:14px}
    .cust-meta{font-size:12px;color:var(--text-dim)}
    .cust-open{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;text-align:right;min-width:100px}
    .cust-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
    .badge{padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
    .b-active{background:rgba(16,185,129,.15);color:#059669}
    .b-paused{background:rgba(245,158,11,.18);color:#92400e}
    .b-wees{background:rgba(220,38,38,.14);color:#b91c1c}
    .b-none{background:var(--border);color:var(--text-dim)}
    .b-signal-high{background:rgba(220,38,38,.14);color:#b91c1c}
    .b-signal-med{background:rgba(245,158,11,.18);color:#92400e}
    .b-signal-low{background:rgba(99,102,241,.14);color:#3730a3}
    .caret{transition:transform .15s ease;font-size:14px;color:var(--text-dim)}
    .cust.open .caret{transform:rotate(90deg)}
    .cust-body{display:none;padding:0 14px 16px;border-top:1px solid var(--border)}
    .cust.open .cust-body{display:block}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
    @media (max-width:900px){.grid2{grid-template-columns:1fr}}
    .section-h{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--text-dim);margin:12px 0 6px;letter-spacing:.4px}
    .kv{font-size:12.5px;color:var(--text);margin-bottom:2px}
    .kv b{color:var(--text);font-weight:700}
    table.t{width:100%;border-collapse:collapse;font-size:12.5px}
    table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--border-soft,rgba(0,0,0,.08));text-align:left}
    table.t th{color:var(--text-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
    table.t tr:last-child td{border-bottom:none}
    .timeline{max-height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:6px}
    .tl-item{display:grid;grid-template-columns:130px 100px 1fr;gap:10px;padding:4px 8px;font-size:12px;border-bottom:1px solid var(--border-soft,rgba(0,0,0,.05))}
    .tl-item:last-child{border-bottom:none}
    .tl-time{color:var(--text-dim);font-family:'SF Mono',Consolas,monospace}
    .tl-kind{font-weight:600}
    .tl-log{color:var(--text)}
    .tl-msg-in{color:#065f46}
    .tl-msg-out{color:#7c3aed}
    .tl-pay{color:#059669;font-weight:700}
    .tl-arr{color:#92400e}
    .msg-body{color:var(--text);font-style:italic;max-height:60px;overflow:hidden}
    .signals{padding:8px 10px;background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.3);border-radius:6px;margin-top:10px}
    .signals ul{margin-left:16px;font-size:12.5px}
    .signals li{margin:2px 0}
    .no-data{color:var(--text-dim);font-style:italic;font-size:12.5px}
    #loading,#empty{padding:40px;text-align:center;color:var(--text-dim);font-size:14px}
    #gate-blocked{display:none;padding:40px;text-align:center;color:var(--text-dim)}
  </style>
  <!-- CRM-toegangsguard (laag 2 bovenop RLS): verbergt de pagina en stuurt
       niet-CRM-rollen (viewer/student) door naar het LMS. MOET vóór elk
       ander script staan — zie modules/shared/crm-guard.js. -->
  <script src="/modules/shared/crm-guard.js"></script>
</head>
<body>
<div id="sidebar-mount"></div>
<div class="app">
  <div class="page-head">
    <h1>🔍 Wanbetalers — diagnostisch overzicht</h1>
    <div class="sub" id="sub-line">Bezig met laden…</div>
  </div>

  <div id="gate-blocked">Alleen super_admin heeft toegang tot deze diagnose.</div>

  <div id="main" style="display:none">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Zoek op klantnaam / factuurnummer / e-mail / telefoon…" autocomplete="off" />
      <div class="tabs">
        <button class="tab active" data-tab="all">Iedereen (<span id="c-all">0</span>)</button>
        <button class="tab"       data-tab="flow">Actieve/gepauzeerde flow (<span id="c-flow">0</span>)</button>
        <button class="tab"       data-tab="issues">Probleemgevallen (<span id="c-issues">0</span>)</button>
      </div>
      <div class="stats" id="signalstats"></div>
      <button class="btn-dl" id="aiBatchBtn" title="Analyseer alle klanten met gesprek (batched, kan even duren)">🤖 Analyseer alle</button>
      <button class="btn-dl" id="aiFilterBtn" title="Toon alleen klanten waar AI zegt: afspraak gemaakt maar niet vastgelegd">🔍 Afspraak-niet-vastgelegd</button>
      <button class="btn-dl" id="dlBtn" title="Download deze pagina als los HTML-bestand (offline)">💾 Download snapshot</button>
      <button class="btn-dl" id="reloadBtn" title="Verse data ophalen">↻ Ververs</button>
    </div>
    <div id="pausedSection"></div>
    <div id="list"><div id="loading">Laden…</div></div>
  </div>
</div>

<!-- Verplaats-tool modal: super_admin-only, opent via renderCust "Verplaats stap"-knop -->
<div id="mvModal" class="mv-modal" role="dialog" aria-modal="true">
  <div class="mv-card">
    <h3>↔ Verplaats dunning-run naar andere stap</h3>
    <div id="mvBody"><div style="color:var(--text-dim);font-size:13px">Laden…</div></div>
    <div class="mv-actions">
      <button class="mv-btn" onclick="closeMoveModal()">Annuleren</button>
      <button class="mv-btn mv-btn-primary" id="mvExecuteBtn" disabled onclick="executeMove()">Uitvoeren</button>
    </div>
  </div>
</div>

<script src="/api/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/modules/shared/supabase-client.js"></script>
<script src="/modules/shared/agent-shared.js"></script>
<script>
'use strict';
let DATA = { customers: [], signal_counts: {}, generated_at: null };
// signalFilter is een Set — multi-select. Klik = toggle. Leeg = geen filter.
// aiResults: client-only cache van AI-analyses (customer_id → {loading|result|error}).
// aiFilterUnrecorded: als true, toon alleen klanten met AI-verdict "JA + geen arrangement".
const state = { tab: 'all', q: '', signalFilter: new Set(), aiResults: new Map(), aiFilterUnrecorded: false };

(async function init() {
  await window._authSharedReady;
  const profile = await window.AuthShared?.requireAuth();
  if (!profile) return;
  if (window.AgentShared) { try { await window.AgentShared.renderUserSection(profile); } catch(_) {} }
  if (profile.role !== 'super_admin') {
    document.getElementById('gate-blocked').style.display = '';
    document.getElementById('sub-line').textContent = 'Toegang geweigerd.';
    return;
  }
  document.getElementById('main').style.display = '';
  wireEvents();
  await loadData();
})();

async function loadData() {
  document.getElementById('list').innerHTML = '<div id="loading">Data laden…</div>';
  try {
    const r = await window.AgentShared.apiFetch('/api/wanbetalers-diagnose-data');
    const d = await r.json();
    if (!r.ok) throw new Error(d?.error || ('HTTP ' + r.status));
    DATA = d;
    // Bootstrap AI-analyse-cache uit backend zodat filter/verdict direct
    // beschikbaar zijn na page-reload. Backend levert cached_analysis per klant
    // met alle velden die het analyse-endpoint zou returnen — behalve customer_id
    // die we bijvoegen zodat renderTestResult 't kan lezen.
    state.aiResults.clear();
    for (const c of d.customers || []) {
      if (c.cached_analysis) {
        state.aiResults.set(c.customer_id, {
          result: Object.assign({ customer_id: c.customer_id, analysed_at: c.cached_analysis.geanalyseerd_op }, c.cached_analysis),
        });
      }
    }
    const gen = d.generated_at ? new Date(d.generated_at).toLocaleString('nl-NL') : '';
    document.getElementById('sub-line').textContent =
      (d.customers?.length || 0) + ' klant(en) met open factuur · snapshot ' + gen +
      ' · ' + state.aiResults.size + ' AI-analyse(s) gecached';
    render();
  } catch (e) {
    document.getElementById('list').innerHTML =
      '<div id="empty" style="color:#dc2626">Fout: ' + esc(e?.message || 'onbekend') + '</div>';
  }
}

function wireEvents() {
  document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  document.querySelectorAll('.tab').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      state.tab = b.dataset.tab;
      render();
    };
  });
  document.getElementById('reloadBtn').onclick = () => loadData();
  document.getElementById('dlBtn').onclick = () => downloadSnapshot();
  document.getElementById('aiBatchBtn').onclick = () => analyseAll();
  document.getElementById('aiFilterBtn').onclick = (e) => {
    state.aiFilterUnrecorded = !state.aiFilterUnrecorded;
    e.currentTarget.classList.toggle('active', state.aiFilterUnrecorded);
    render();
  };
}

// Batch: analyseer alle klanten met een gesprek (skip als al geanalyseerd).
// Serieel om API-rate-limits en UI-flood te voorkomen; 400ms tussen calls.
async function analyseAll() {
  const btn = document.getElementById('aiBatchBtn');
  const orig = btn.textContent;
  const candidates = (DATA.customers || [])
    .filter((c) => c.summary.total_messages > 0 && !state.aiResults.get(c.customer_id));
  if (candidates.length === 0) {
    alert('Alles is al geanalyseerd of er is niks te analyseren.');
    return;
  }
  if (!confirm('Analyseer ' + candidates.length + ' klant(en) via AI? Kost 1 AI-call per klant.')) return;
  btn.disabled = true;
  let done = 0;
  for (const c of candidates) {
    btn.textContent = '🤖 Bezig ' + (++done) + '/' + candidates.length + '…';
    try {
      state.aiResults.set(c.customer_id, { loading: true });
      const r = await window.AgentShared.apiFetch('/api/wanbetalers-diagnose-analyse-gesprek', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customer_id: c.customer_id }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d?.error || ('HTTP ' + r.status));
      state.aiResults.set(c.customer_id, { result: d });
    } catch (e) {
      state.aiResults.set(c.customer_id, { error: e?.message || 'onbekend' });
    }
    // Kleine pauze om Anthropic-rate-limit + UI leefbaar te houden.
    await new Promise((r) => setTimeout(r, 400));
  }
  btn.disabled = false;
  btn.textContent = orig;
  render();
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmtEur(n) { return (Number(n) || 0).toLocaleString('nl-NL', { style: 'currency', currency: 'EUR' }); }
function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return String(iso); return d.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit', year: '2-digit' }); }
function fmtDT(iso) { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return String(iso); return d.toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }

function statusBadge(c) {
  const r = c.run;
  if (!r) return '<span class="badge b-none">Geen run</span>';
  if (r.status === 'active') return '<span class="badge b-active">Actief</span>';
  if (r.status === 'paused') {
    if (r.reason === 'wees') return '<span class="badge b-wees">Wees-run</span>';
    if (r.reason === 'inbox_reply') return '<span class="badge b-paused">In gesprek</span>';
    if (r.reason === 'arrangement') return '<span class="badge b-paused">Regeling</span>';
    if (r.reason === 'manual') return '<span class="badge b-paused">Handmatig</span>';
    return '<span class="badge b-paused">Gepauzeerd</span>';
  }
  return '<span class="badge b-none">' + esc(r.status) + '</span>';
}

function filterCustomers() {
  const q = state.q.trim().toLowerCase();
  return (DATA.customers || []).filter((c) => {
    if (q) {
      const hay = (c.name + ' ' + (c.email || '') + ' ' + (c.phone || '') + ' ' + (c.open_invoices || []).map((i) => i.invoice_number).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (state.tab === 'flow') {
      if (!c.run || !['active', 'paused'].includes(c.run.status)) return false;
    }
    if (state.tab === 'issues') {
      if (!c.signals || c.signals.length === 0) return false;
    }
    // Signaal-filter (multi-select). Klant moet MINSTENS EEN van de
    // geselecteerde signalen hebben. Lege set = geen filter.
    if (state.signalFilter.size > 0) {
      const codes = new Set((c.signals || []).map((s) => s.code));
      let hit = false;
      for (const code of state.signalFilter) { if (codes.has(code)) { hit = true; break; } }
      if (!hit) return false;
    }
    // AI-filter: alleen klanten waar de AI zegt "JA + geen arrangement".
    if (state.aiFilterUnrecorded && !hasUnrecordedAgreement(c)) return false;
    return true;
  });
}

function render() {
  const filtered = filterCustomers();
  document.getElementById('c-all').textContent = (DATA.customers || []).length;
  document.getElementById('c-flow').textContent = (DATA.customers || []).filter((c) => c.run && ['active','paused'].includes(c.run.status)).length;
  document.getElementById('c-issues').textContent = (DATA.customers || []).filter((c) => c.signals && c.signals.length > 0).length;

  // Klikbare signaal-chips — toggle multi-filter.
  // Toon alle signalen die minstens 1x voorkomen, gesorteerd op aantal DESC.
  const codes = Object.entries(DATA.signal_counts || {}).sort((a, b) => b[1] - a[1]);
  const chipsHtml = codes.map(([k, v]) => {
    const active = state.signalFilter.has(k) ? ' active' : '';
    return '<button data-sigcode="' + esc(k) + '" class="' + active + '" title="Klik: filter alleen deze; nog eens klikken: uit">' + esc(k) + ': ' + v + '</button>';
  }).join('');
  const clearBtn = state.signalFilter.size > 0
    ? '<button class="clear" id="clearSigFilter" title="Wis signaal-filter">✕ filter wissen (' + state.signalFilter.size + ')</button>'
    : '';
  document.getElementById('signalstats').innerHTML = chipsHtml + clearBtn;
  document.querySelectorAll('#signalstats [data-sigcode]').forEach((b) => {
    b.onclick = () => {
      const code = b.dataset.sigcode;
      if (state.signalFilter.has(code)) state.signalFilter.delete(code);
      else state.signalFilter.add(code);
      render();
    };
  });
  const clearEl = document.getElementById('clearSigFilter');
  if (clearEl) clearEl.onclick = () => { state.signalFilter.clear(); render(); };

  // Paused-blok bovenaan (alleen zichtbaar op tab 'all' of 'flow' als er
  // paused-klanten zijn en er geen zoekopdracht/filter loopt).
  renderPausedSection();

  document.getElementById('list').innerHTML = filtered.map(renderCust).join('')
    || '<div id="empty">Geen klanten in deze weergave.</div>';
  document.querySelectorAll('.cust-head').forEach((h) => { h.onclick = () => h.parentElement.classList.toggle('open'); });
}

function renderPausedSection() {
  const host = document.getElementById('pausedSection');
  // Alleen tonen op default view (tab=all + geen zoek/signaal-filter),
  // anders vervuilt 't de filter-view.
  const isDefault = state.tab === 'all' && !state.q && state.signalFilter.size === 0;
  if (!isDefault) { host.innerHTML = ''; return; }
  const paused = (DATA.customers || []).filter((c) => c.run && c.run.status === 'paused');
  if (paused.length === 0) { host.innerHTML = ''; return; }
  // Sorteer op openstaand DESC.
  paused.sort((a, b) => (b.summary.total_open_eur || 0) - (a.summary.total_open_eur || 0));
  const rows = paused.map((c) => {
    const r = c.run;
    let redenBadge = '';
    if (r.reason === 'wees')        redenBadge = '<span class="badge b-wees">Wees-run (geen reden)</span>';
    else if (r.reason === 'inbox_reply')  redenBadge = '<span class="badge b-paused">In gesprek (klant reageerde)</span>';
    else if (r.reason === 'arrangement')  redenBadge = '<span class="badge b-paused">Regeling / breach</span>';
    else if (r.reason === 'manual')       redenBadge = '<span class="badge b-paused">Handmatig</span>';
    else                                  redenBadge = '<span class="badge b-paused">Gepauzeerd</span>';
    const verlopen = (r.days_past_next_action != null && r.days_past_next_action >= 1)
      ? ' <span class="b-verlopen" title="Volgende actie ligt in het verleden">⚠ ' + r.days_past_next_action + ' dg verlopen</span>' : '';
    const reasonText = r.reason_label ? esc(r.reason_label) : '';
    return '<div class="paused-row">'
      + '<div><div class="pnaam">' + esc(c.name) + '</div><div class="preden">' + reasonText + '</div></div>'
      + '<div>' + redenBadge + verlopen + '</div>'
      + '<div class="preden">stap ' + (r.step_order == null ? '—' : r.step_order) + ' · ' + esc(r.step_type || '—') + '</div>'
      + '<div class="popen">' + fmtEur(c.summary.total_open_eur) + '</div>'
      + '</div>';
  }).join('');
  host.innerHTML = '<div class="paused-section">'
    + '<h2>⏸ Gepauzeerd <span class="cnt">' + paused.length + '</span></h2>'
    + rows
    + '</div>';
}

function renderCust(c) {
  const r = c.run;
  const verlopenHtml = (r && r.days_past_next_action != null && r.days_past_next_action >= 1)
    ? ' <span class="b-verlopen" title="Volgende actie ligt in het verleden">⚠ ' + r.days_past_next_action + ' dg verlopen</span>'
    : '';
  // nextActionHtml bevat al veilig-geëscapete data + de verlopen-span.
  // Niet nog een keer esc() eromheen.
  const nextActionHtml = r && r.next_action_at
    ? (esc(fmtDT(r.next_action_at)) + (r.step_type ? ' · ' + esc(r.step_type) : '') + verlopenHtml)
    : (r ? '—' : '—');
  const badges = (c.signals || []).slice(0, 3).map((s) => {
    const cls = s.severity === 'high' ? 'b-signal-high' : (s.severity === 'medium' ? 'b-signal-med' : 'b-signal-low');
    return '<span class="badge ' + cls + '" title="' + esc(s.msg) + '">⚠</span>';
  }).join('');
  return '<div class="cust" data-cust-id="' + esc(c.customer_id) + '">' +
    '<div class="cust-head">' +
      '<div><div class="cust-name">' + esc(c.name) + '</div>' +
        '<div class="cust-meta">' + (c.email ? esc(c.email) : '') + (c.phone ? ' · ' + esc(c.phone) : '') + ' · ' +
        (c.summary.open_invoice_count || 0) + ' fact. · ' + (c.summary.days_overdue == null ? '—' : c.summary.days_overdue + ' dg te laat') +
        (c.summary.pipeline_stage ? ' · fase=' + esc(c.summary.pipeline_stage) : '') +
        '</div></div>' +
      '<div class="cust-open">' + fmtEur(c.summary.total_open_eur) + '</div>' +
      '<div>' + statusBadge(c) + ' <span class="cust-meta">' + nextActionHtml + '</span></div>' +
      '<div class="cust-badges">' + badges + '</div>' +
      '<div class="caret">▸</div>' +
    '</div>' +
    '<div class="cust-body">' + renderBody(c) + '</div>' +
  '</div>';
}

function renderBody(c) {
  const sigs = c.signals && c.signals.length
    ? '<div class="signals"><div class="section-h" style="color:#b91c1c;margin-top:0">Signalen</div><ul>' +
        c.signals.map((s) => '<li><b>' + esc(s.code) + ':</b> ' + esc(s.msg) + '</li>').join('') +
      '</ul></div>' : '';

  // Verplaats-knop alleen bij een run in active/paused (server valideert
  // dat ook, maar UI verbergt 'em bij completed/cancelled).
  const canMove = c.run && ['active','paused'].includes(c.run.status);
  const moveBtn = canMove
    ? '<button class="btn-dl" style="margin-top:6px" onclick="openMoveModal(\'' + esc(c.run.id) + '\',\'' + esc(c.customer_id) + '\')" title="Verplaats deze run naar een andere workflow-stap (super_admin only, ontwerp docs/wanbetalers-verplaats-tool-ontwerp.md)">↔ Verplaats stap</button>'
    : '';
  const runBlock = c.run
    ? '<div><div class="section-h">Dunning run</div>' +
      '<div class="kv">status=<b>' + esc(c.run.status) + '</b>' + (c.run.reason ? ' · reden=<b>' + esc(c.run.reason_label || c.run.reason) + '</b>' : '') + '</div>' +
      '<div class="kv">workflow=<b>' + esc(c.run.workflow_name || '—') + '</b> · stap=' + (c.run.step_order == null ? '—' : c.run.step_order) + ' ' + esc(c.run.step_type || '') + (c.run.step_title ? ' ("' + esc(c.run.step_title) + '")' : '') + '</div>' +
      '<div class="kv">next_action_at=<b>' + esc(fmtDT(c.run.next_action_at)) + '</b> · updated_at=' + esc(fmtDT(c.run.updated_at)) + (c.run.needs_attention ? ' · <b style="color:#b91c1c">NEEDS_ATTENTION</b>' : '') + '</div>' +
      moveBtn +
      '</div>'
    : '<div><div class="section-h">Dunning run</div><div class="no-data">Geen actieve of gepauzeerde run.</div></div>';

  const arr = c.arrangements && c.arrangements.length
    ? '<div><div class="section-h">Regelingen</div>' +
        c.arrangements.map((a) => '<div class="kv"><b>' + esc(a.type) + '</b> · ' + esc(a.status) + ' · aangemaakt ' + esc(fmtDate(a.created_at)) + '</div>').join('') +
      '</div>'
    : '<div><div class="section-h">Regelingen</div><div class="no-data">Geen vastgelegd (payment_arrangements is leeg voor deze klant).</div></div>';

  const invs = c.open_invoices && c.open_invoices.length
    ? '<table class="t"><thead><tr><th>Nr</th><th>Vervaldatum</th><th>Status</th><th>Open</th></tr></thead><tbody>' +
        c.open_invoices.map((i) => '<tr><td>' + esc(i.invoice_number || '—') + '</td><td>' + esc(fmtDate(i.due_date)) + '</td><td>' + esc(i.status) + '</td><td>' + fmtEur(i.bedrag_open) + '</td></tr>').join('') +
      '</tbody></table>' : '<div class="no-data">Geen open facturen.</div>';

  const pays = c.payments && c.payments.length
    ? '<table class="t"><thead><tr><th>Nr</th><th>Betaald op</th><th>Bedrag betaald</th><th>Status</th></tr></thead><tbody>' +
        c.payments.slice(0, 15).map((p) => '<tr><td>' + esc(p.invoice_number || '—') + '</td><td>' + esc(fmtDate(p.paid_date)) + '</td><td>' + fmtEur(p.amount_paid) + '</td><td>' + esc(p.status) + '</td></tr>').join('') +
      '</tbody></table>' : '<div class="no-data">Geen betaalhistorie in DB.</div>';

  const sends = c.sends && c.sends.length
    ? '<table class="t"><thead><tr><th>Wanneer</th><th>Event</th><th>Template</th><th>Naar</th><th>Meta-code / wamid</th></tr></thead><tbody>' +
        c.sends.slice(0, 20).map((s) => {
          let eraBadge = '';
          if (s.era === 'historisch') eraBadge = '<span class="era-hist" title="Vóór dag7/dag14-fix van 2 aug 09:00 — historisch">vóór fix</span>';
          else if (s.era === 'actief') eraBadge = '<span class="era-act" title="NA dag7/dag14-fix — actief probleem, verzending faalt nog steeds">na fix</span>';
          return '<tr><td>' + esc(fmtDT(s.at)) + '</td><td>' + esc(s.event_type) + eraBadge + '</td><td>' + esc(s.meta_template_name || '—') + '</td><td>' + esc(s.to || '—') + '</td><td>' + esc(s.meta_code || s.wamid || s.error || '—') + '</td></tr>';
        }).join('') +
      '</tbody></table>' : '<div class="no-data">Geen aanmaan-events gelogd.</div>';

  // AI-analyse blok — on-demand knop + resultaat als 't al is opgehaald.
  const aiState = state.aiResults.get(c.customer_id);
  let aiBlock = '<div class="ai-block"><h4>🤖 AI-gespreksanalyse</h4>';
  if (aiState && aiState.loading) {
    aiBlock += '<div class="ai-result">Bezig met analyseren…</div>';
  } else if (aiState && aiState.error) {
    aiBlock += '<div class="ai-result" style="color:#dc2626">Fout: ' + esc(aiState.error) + '</div>' +
      '<button class="ai-btn" onclick="analyseGesprek(\'' + esc(c.customer_id) + '\')">Opnieuw proberen</button>';
  } else if (aiState && aiState.result) {
    const r = aiState.result;
    const verdictCls = r.afspraak_gemaakt === 'JA' ? 'ai-verdict-ja'
                     : (r.afspraak_gemaakt === 'NEE' ? 'ai-verdict-nee' : 'ai-verdict-onduidelijk');
    const termijnenTxt = (r.termijnen && r.termijnen.length)
      ? '<div class="ai-result" style="margin-top:4px">Termijnen: ' + r.termijnen.map((t) => esc((t.bedrag_eur ? '€' + t.bedrag_eur : '?') + ' op ' + (t.datum || '?'))).join(' · ') + '</div>' : '';
    aiBlock += '<div class="ai-result">'
      + '<span class="' + verdictCls + '">Afspraak: ' + esc(r.afspraak_gemaakt) + '</span>'
      + ' <span style="color:var(--text-dim);font-size:11.5px">vertrouwen: ' + esc(r.vertrouwen) + '</span>'
      + ' <span style="color:var(--text-dim);font-size:11.5px">· ' + (r.messages_count || 0) + ' berichten geanalyseerd</span>'
      + '</div>'
      + '<div class="ai-result" style="margin-top:6px"><b>Samenvatting:</b> ' + esc(r.samenvatting || '—') + '</div>'
      + termijnenTxt
      + '<div class="ai-result" style="margin-top:6px"><b>Actie nodig:</b> ' + esc(r.actie_nodig || '—') + '</div>'
      + '<div style="margin-top:6px;font-size:11px;color:var(--text-dim)">Geanalyseerd op ' + esc(fmtDT(r.analysed_at))
      + (r.geanalyseerd_door_name ? ' door ' + esc(r.geanalyseerd_door_name)
         : (r.geanalyseerd_door_email ? ' door ' + esc(r.geanalyseerd_door_email) : ''))
      + '</div>'
      + '<button class="ai-btn" style="margin-top:6px" onclick="analyseGesprek(\'' + esc(c.customer_id) + '\')">🔄 Opnieuw analyseren</button>';
  } else if (c.summary.total_messages === 0) {
    aiBlock += '<div class="ai-result no-data">Geen gesprek om te analyseren.</div>';
  } else {
    aiBlock += '<button class="ai-btn" onclick="analyseGesprek(\'' + esc(c.customer_id) + '\')">Analyseer dit gesprek</button>'
      + '<div style="font-size:11px;color:var(--text-dim);margin-top:4px">On-demand — kost 1 AI-call. Alleen samenvatting wordt opgeslagen (geen volledig gesprek).</div>';
  }
  aiBlock += '</div>';

  const convs = c.conversations && c.conversations.length
    ? c.conversations.map((cv) => {
        const msgs = cv.messages_shown.map((m) =>
          '<div class="tl-item"><div class="tl-time">' + esc(fmtDT(m.created_at)) + '</div>' +
          '<div class="tl-kind ' + (m.direction === 'in' ? 'tl-msg-in' : 'tl-msg-out') + '">' + (m.direction === 'in' ? '← klant' : '→ wij') + '</div>' +
          '<div class="msg-body">' + esc(m.body || '') + '</div></div>'
        ).join('');
        return '<div style="margin-bottom:10px"><div class="kv">Status: ' + esc(cv.status) + ' · ' + cv.total_messages + ' berichten · laatst inbound ' + esc(fmtDT(cv.last_inbound_at)) + '</div>' +
          (msgs ? '<div class="timeline" style="margin-top:6px">' + msgs + '</div>' : '<div class="no-data">Geen recente berichten.</div>') +
        '</div>';
      }).join('') : '<div class="no-data">Geen WhatsApp-conversatie.</div>';

  const tl = c.timeline && c.timeline.length
    ? '<div class="timeline">' + c.timeline.slice(0, 60).map((t) => {
        let cls = 'tl-log', lbl = t.event;
        if (t.kind === 'msg') { cls = t.event === 'wa_inbound' ? 'tl-msg-in' : 'tl-msg-out'; lbl = t.event === 'wa_inbound' ? 'WA in' : 'WA uit'; }
        else if (t.kind === 'payment') { cls = 'tl-pay'; lbl = '€ betaald'; }
        else if (t.kind === 'arrangement') { cls = 'tl-arr'; lbl = 'regeling'; }
        const extra = t.body ? ' — ' + esc(String(t.body).slice(0, 140))
          : (t.invoice ? ' ' + esc(t.invoice) + ' ' + fmtEur(t.amount_paid)
             : (t.arr_type ? ' ' + esc(t.arr_type) + '/' + esc(t.arr_status) : ''));
        return '<div class="tl-item"><div class="tl-time">' + esc(fmtDT(t.at)) + '</div><div class="tl-kind ' + cls + '">' + esc(lbl) + '</div><div>' + esc(t.event) + extra + '</div></div>';
      }).join('') + '</div>' : '<div class="no-data">Geen tijdlijn-events.</div>';

  return sigs +
    '<div class="grid2">' + runBlock + arr + '</div>' +
    aiBlock +
    '<div class="section-h">Open facturen</div>' + invs +
    '<div class="section-h">Betaalhistorie (laatste 15)</div>' + pays +
    '<div class="section-h">Verzonden aanmaningen (log)</div>' + sends +
    '<div class="section-h">WhatsApp-conversatie(s) — laatste 10 per conv</div>' + convs +
    '<div class="section-h">Chronologische tijdlijn (max 60)</div>' + tl;
}

// AI-analyse state (client-side alleen — geen server-persistence).
// Map<customer_id, { loading, result, error }>
async function analyseGesprek(customerId) {
  state.aiResults.set(customerId, { loading: true });
  render();
  try {
    const r = await window.AgentShared.apiFetch('/api/wanbetalers-diagnose-analyse-gesprek', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customer_id: customerId }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d?.error || ('HTTP ' + r.status));
    state.aiResults.set(customerId, { result: d });
  } catch (e) {
    state.aiResults.set(customerId, { error: e?.message || 'onbekend' });
  }
  render();
  // Herstel scroll naar dezelfde klant (render()  vervangt DOM).
  const el = document.querySelector('[data-cust-id="' + customerId + '"]');
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// Filter-helper: is er een AI-analyse die zegt "afspraak gemaakt maar niet vastgelegd"?
function hasUnrecordedAgreement(c) {
  const r = state.aiResults.get(c.customer_id);
  return r && r.result && r.result.afspraak_gemaakt === 'JA' && !r.result.heeft_arrangement;
}

// ─────────────────────────────────────────────────────────────────────
// Verplaats-tool (fase 1) — ontwerp: docs/wanbetalers-verplaats-tool-ontwerp.md
// Endpoints:
//   GET  /api/wanbetalers-diagnose-workflow-steps?run_id=...   (steps-lijst)
//   POST /api/wanbetalers-diagnose-run-verplaats-preview       (dry-run info)
//   POST /api/wanbetalers-diagnose-run-verplaats               (execute)
// State is client-only. Modal wordt bij openen gereset.
// ─────────────────────────────────────────────────────────────────────
const moveState = {
  runId:        null,
  customerId:   null,
  steps:        [],       // uit workflow-steps endpoint
  targetStepId: null,
  triggerNow:   false,
  cancelPa:     false,
  preview:      null,     // laatste preview-response
  loadingPrev:  false,
  confirmText:  '',       // typ-bevestiging bij live-send
};

function openMoveModal(runId, customerId) {
  Object.assign(moveState, {
    runId, customerId,
    steps: [], targetStepId: null, triggerNow: false, cancelPa: false,
    preview: null, loadingPrev: false, confirmText: '',
  });
  document.getElementById('mvModal').classList.add('show');
  document.getElementById('mvBody').innerHTML = '<div style="color:var(--text-dim);font-size:13px">Workflow-stappen laden…</div>';
  document.getElementById('mvExecuteBtn').disabled = true;
  loadMoveSteps();
}
function closeMoveModal() {
  document.getElementById('mvModal').classList.remove('show');
}

async function loadMoveSteps() {
  try {
    const r = await window.AgentShared.apiFetch('/api/wanbetalers-diagnose-workflow-steps?run_id=' + encodeURIComponent(moveState.runId));
    const d = await r.json();
    if (!r.ok) throw new Error(d?.error || ('HTTP ' + r.status));
    moveState.steps = d.steps || [];
    // Default: current step preselected (dus 'verplaats naar zichzelf' geeft duidelijke waarschuwing)
    moveState.targetStepId = d.current_step_id || (moveState.steps[0] && moveState.steps[0].id) || null;
    renderMoveModalBody();
    refreshMovePreview();
  } catch (e) {
    document.getElementById('mvBody').innerHTML = '<div class="tp-err" style="color:#dc2626">Fout: ' + esc(e?.message || 'onbekend') + '</div>';
  }
}

function renderMoveModalBody() {
  const body = document.getElementById('mvBody');
  const stepsOpts = moveState.steps.map((s) => {
    const label = s.step_order + ' · ' + s.step_type + (s.config_title ? ' · "' + s.config_title + '"' : '')
      + (s.risk === 'risky' ? '  🔴 stuurt bericht' : '  ✅ geen send');
    return '<option value="' + esc(s.id) + '"' + (s.id === moveState.targetStepId ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');
  const p = moveState.preview;

  let previewHtml = '<div class="mv-preview" id="mvPreviewBox">Preview laden…</div>';
  if (p && p.ok) {
    previewHtml = renderMovePreview(p);
  } else if (p && !p.ok) {
    previewHtml = '<div class="mv-preview" style="color:#dc2626">Fout: ' + esc(p.error || 'onbekend') + '</div>';
  }

  // Toon typ-input alleen als live-send vereist.
  const showLiveConfirm = p && p.ok && p.requires_live_send_confirmation;
  const liveConfirmHtml = showLiveConfirm
    ? '<div class="mv-warn-live">🔴 LIVE SEND — er gaat NU een bericht naar bovenstaande klant. Typ ter bevestiging exact:</div>'
      + '<div style="font-family:\'SF Mono\',Consolas,monospace;font-size:13px;background:var(--bg);padding:6px 10px;border-radius:4px;border:1px solid var(--border);margin-top:4px">' + esc(p.expected_confirmation_text) + '</div>'
      + '<input type="text" id="mvConfirmInput" style="margin-top:6px" placeholder="Typ hier de bevestigingstekst…" oninput="moveState.confirmText = this.value; renderMoveExecuteBtn()" value="' + esc(moveState.confirmText) + '" />'
    : '';

  body.innerHTML = ''
    + '<label>Doel-stap</label>'
    + '<select id="mvTargetStepSelect" onchange="onMoveStepChange(this.value)">' + stepsOpts + '</select>'
    + '<label class="mv-check"><input type="checkbox" id="mvCancelPa"' + (moveState.cancelPa ? ' checked' : '') + ' onchange="moveState.cancelPa = this.checked; refreshMovePreview()">'
    + '<span><b>Cancel-cascade:</b> zet open PENDING/APPROVED pending_action(s) van de HUIDIGE stap op CANCELLED (behoud audit-spoor; niet hard verwijderd). Krijgt een aparte log-entry per taak.</span></label>'
    + '<label class="mv-check"><input type="checkbox" id="mvTriggerNow"' + (moveState.triggerNow ? ' checked' : '') + ' onchange="moveState.triggerNow = this.checked; refreshMovePreview()">'
    + '<span><b>Trigger direct:</b> zet next_action_at op nu, engine pikt bij volgende cron op. Bij email/whatsapp doel-stap: 2-staps typ-bevestiging vereist.</span></label>'
    + previewHtml
    + liveConfirmHtml;
  renderMoveExecuteBtn();
}

function renderMovePreview(p) {
  // Klant-blok
  const c = p.customer;
  const isRealCustomer = !c.is_test;
  const custHeader =
    '<div style="font-size:13px;line-height:1.6">'
    + '<b>Klant:</b> ' + esc(c.name) + '<br>'
    + (c.email  ? '<b>E-mail:</b> ' + esc(c.email) + '<br>' : '')
    + (c.phone  ? '<b>Telefoon:</b> ' + esc(c.phone) + '<br>' : '')
    + '<b>Openstaand:</b> ' + fmtEur(c.total_open_eur) + ' (' + c.open_invoice_count + ' factu(u)r(en))'
    + '</div>';

  const cur = p.current_step;
  const tgt = p.target_step;
  const stepsBlock =
    '<div style="margin-top:10px;font-size:13px;line-height:1.6">'
    + '<b>Huidige stap:</b> ' + (cur ? cur.step_order + ' · ' + esc(cur.step_type) + (cur.config_title ? ' · "' + esc(cur.config_title) + '"' : '') : '—') + '<br>'
    + '<b>Nieuwe stap:</b> ' + tgt.step_order + ' · ' + esc(tgt.step_type) + (tgt.config_title ? ' · "' + esc(tgt.config_title) + '"' : '')
    + (tgt.risk === 'risky' ? ' 🔴' : ' ✅')
    + '</div>';

  const paBlock = (moveState.cancelPa && p.open_pending_actions_current_step.length > 0)
    ? '<div style="margin-top:10px;font-size:13px"><b>Wordt gecanceld:</b><ul class="mv-pa-list">'
      + p.open_pending_actions_current_step.map((pa) => '<li>' + esc(pa.action_type) + (pa.title ? ' — "' + esc(pa.title) + '"' : '') + ' (aangemaakt ' + esc(fmtDate(pa.created_at)) + ', status ' + esc(pa.status) + ')</li>').join('')
      + '</ul></div>'
    : (moveState.cancelPa
        ? '<div style="margin-top:10px;font-size:13px;color:var(--text-dim)">Cancel-cascade aan, maar geen open pending_action gevonden voor huidige stap.</div>'
        : '');

  const willHappen =
    '<div style="margin-top:10px;padding:8px 10px;border:1px dashed var(--border);border-radius:6px;font-size:12.5px;line-height:1.5">'
    + '<b>Wat gaat er gebeuren:</b><br>'
    + '• current_step_id → ' + esc(tgt.id.slice(0,8)) + '…<br>'
    + '• next_action_at → ' + (p.trigger_now ? '<b>NU</b> (engine pikt op)' : '<b>NULL</b> (engine pikt NIET automatisch op)') + '<br>'
    + '• cancel_cascade → ' + (moveState.cancelPa ? 'JA (' + p.open_pending_actions_current_step.length + ' actie(s))' : 'NEE')
    + '</div>';

  const tplBlock = p.template_preview
    ? '<div style="margin-top:10px;font-size:12.5px"><b>Template-preview (dit gaat verstuurd worden):</b>'
      + (p.template_preview.subject ? '<div style="margin-top:4px"><b>Onderwerp:</b> ' + esc(p.template_preview.subject) + '</div>' : '')
      + '<div class="mv-tpl-preview">' + esc(p.template_preview.body || p.template_preview.render_error || '(geen body)') + '</div>'
      + (p.template_preview.to ? '<div style="margin-top:4px"><b>Naar:</b> ' + esc(p.template_preview.to) + '</div>' : '')
      + '</div>'
    : '';

  const warnBlock = (p.warnings || []).length
    ? '<div class="mv-warn-note">⚠ ' + p.warnings.map(esc).join('<br>⚠ ') + '</div>'
    : '';
  const realCustBlock = isRealCustomer
    ? '<div class="mv-warn-real">⚠ ECHTE klant (geen test-persoon) — dubbelcheck naam + bedrag bovenaan.</div>'
    : '<div class="mv-warn-note" style="background:rgba(16,185,129,.14);color:#065f46">✅ Test-klant (is_test=true) — veilig om mee te oefenen.</div>';

  return '<div class="mv-preview">' + custHeader + stepsBlock + paBlock + willHappen + tplBlock + '</div>' + realCustBlock + warnBlock;
}

function renderMoveExecuteBtn() {
  const btn = document.getElementById('mvExecuteBtn');
  if (!btn) return;
  const p = moveState.preview;
  if (!p || !p.ok) { btn.disabled = true; btn.textContent = 'Uitvoeren'; return; }
  if (p.requires_live_send_confirmation) {
    const expected = String(p.expected_confirmation_text || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const got      = String(moveState.confirmText || '').trim().toLowerCase().replace(/\s+/g, ' ');
    btn.disabled = (expected !== got);
    btn.textContent = btn.disabled ? 'Typ eerst bevestiging' : '🔴 LIVE UITVOEREN';
    btn.className = 'mv-btn ' + (btn.disabled ? '' : 'mv-btn-danger');
  } else {
    btn.disabled = false;
    btn.textContent = 'Uitvoeren';
    btn.className = 'mv-btn mv-btn-primary';
  }
}

function onMoveStepChange(newId) {
  moveState.targetStepId = newId;
  refreshMovePreview();
}

async function refreshMovePreview() {
  if (!moveState.runId || !moveState.targetStepId) return;
  moveState.loadingPrev = true;
  const box = document.getElementById('mvPreviewBox');
  if (box) box.textContent = 'Preview laden…';
  try {
    const r = await window.AgentShared.apiFetch('/api/wanbetalers-diagnose-run-verplaats-preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        run_id:                          moveState.runId,
        target_step_id:                  moveState.targetStepId,
        trigger_now:                     moveState.triggerNow,
        cancel_current_pending_actions:  moveState.cancelPa,
      }),
    });
    const d = await r.json();
    moveState.preview = r.ok ? d : { ok: false, error: d?.error || ('HTTP ' + r.status) };
  } catch (e) {
    moveState.preview = { ok: false, error: e?.message || 'onbekend' };
  }
  moveState.loadingPrev = false;
  renderMoveModalBody();
}

async function executeMove() {
  const p = moveState.preview;
  if (!p || !p.ok) return;
  const btn = document.getElementById('mvExecuteBtn');
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Bezig…';
  try {
    const r = await window.AgentShared.apiFetch('/api/wanbetalers-diagnose-run-verplaats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        run_id:                          moveState.runId,
        target_step_id:                  moveState.targetStepId,
        trigger_now:                     moveState.triggerNow,
        cancel_current_pending_actions:  moveState.cancelPa,
        live_send_confirmation:          p.requires_live_send_confirmation ? moveState.confirmText : undefined,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d?.error || ('HTTP ' + r.status));
    // Toon resultaat + auto-refresh na 1s.
    alert('✓ Verplaatsing OK\n\n' +
      'Van: ' + (d.from_step_type || '?') + ' → naar: ' + (d.to_step_type || '?') + '\n' +
      'Cancelled taken: ' + (d.cancelled_pending_actions_count || 0) + '\n' +
      'Trigger nu: ' + (d.trigger_now ? 'JA' : 'nee') + '\n\n' +
      (d.note || ''));
    closeMoveModal();
    await loadData();  // volledige data-refresh
  } catch (e) {
    alert('✗ Fout: ' + (e?.message || 'onbekend'));
    btn.disabled = false; btn.textContent = orig;
  }
}
// Sluit ook bij klik op overlay of ESC.
document.addEventListener('click', (e) => {
  const modal = document.getElementById('mvModal');
  if (modal && e.target === modal) closeMoveModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMoveModal();
});

// Download huidige rendering als self-contained HTML. Ontkoppelt van de
// live-app: wat je zag, sla je op. Data wordt embedded als JSON zodat het
// bestand ook offline werkt (met minimale re-render).
function downloadSnapshot() {
  const dataJson = JSON.stringify(DATA).replace(/<\/script>/gi, '<\\/script>');
  const gen = DATA.generated_at || new Date().toISOString();
  const cssBlocks = Array.from(document.styleSheets).map((s) => {
    try {
      return Array.from(s.cssRules).map((r) => r.cssText).join('\n');
    } catch (_) { return ''; }
  }).join('\n');
  const listHtml = document.getElementById('list').innerHTML;
  const html = '<!doctype html><html lang="nl"><head><meta charset="utf-8" /><title>Wanbetalers snapshot ' + esc(gen) + '</title>' +
    '<style>' + cssBlocks + '\nbody{margin:20px;background:#f6f8fa;color:#111} .app{margin-left:0;max-width:1400px;margin-inline:auto}</style>' +
    '</head><body><div class="app">' +
    '<h1 style="font-size:22px;font-weight:800">🔍 Wanbetalers snapshot (offline)</h1>' +
    '<div style="color:#666;font-size:12.5px;margin:4px 0 14px">Gegenereerd: ' + esc(gen) + ' · ' + (DATA.customers?.length || 0) + ' klanten</div>' +
    '<div id="list">' + listHtml + '</div>' +
    '<script>document.querySelectorAll(".cust-head").forEach(h=>{h.onclick=()=>h.parentElement.classList.toggle("open")});<\/script>' +
    '</div></body></html>';
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wanbetalers-diagnose-' + gen.replace(/[:.]/g, '-').slice(0, 19) + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
