<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Klanten · v2 preview · De Forex Opleiding</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

  <!-- Vroeg dark-mode-init om FOUC te voorkomen. Geen module-import
       ivm blocking; kleine inline. Waarde synchroniseert met theme.js. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem('dfo-crm-theme');
        if (v === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.setAttribute('data-theme', 'light');
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="stylesheet" href="../shared/design-system/tokens.css">
  <link rel="stylesheet" href="../shared/design-system/components.css">
  <link rel="stylesheet" href="klanten-v2.css">

  <!-- Supabase auth (bestaande shared client) -->
  <script src="../shared/supabase-client.js"></script>
</head>
<body>
  <div class="klanten-v2 ds-app" id="app">

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="ds-sidebar" aria-label="Navigatie">
      <div class="ds-brand">
        <div class="ds-brand-mark">DFO</div>
        <div>
          <div class="ds-brand-name">Forex Opleiding</div>
          <div class="ds-brand-sub">CRM · v2 preview</div>
        </div>
      </div>

      <nav class="ds-nav">
        <!-- Klanten is de enige v2-module momenteel; overige links wijzen
             naar oude modules zodat de gebruiker snel terug kan schakelen. -->
        <a class="ds-nav-item" href="/index.html" title="Dashboard">
          <span class="ds-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
          </span>
          <span>Dashboard</span>
        </a>
        <a class="ds-nav-item" href="/modules/sales.html" title="Sales">
          <span class="ds-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
          </span>
          <span>Sales</span>
        </a>
        <a class="ds-nav-item active" href="/modules/klanten-v2/index.html" title="Klanten (v2 preview)" aria-current="page">
          <span class="ds-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13A4 4 0 0 1 16 11"/></svg>
          </span>
          <span>Klanten</span>
        </a>
        <a class="ds-nav-item" href="/modules/finance.html" title="Finance">
          <span class="ds-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M4 10h16"/><path d="M8 15h4"/></svg>
          </span>
          <span>Finance</span>
        </a>
        <a class="ds-nav-item" href="/modules/email.html" title="E-mail">
          <span class="ds-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
          </span>
          <span>E-mail</span>
        </a>
        <a class="ds-nav-item" href="/modules/taken.html" title="Taken">
          <span class="ds-nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
          </span>
          <span>Taken</span>
        </a>
      </nav>

      <div class="ds-sidebar-foot">
        <div class="ds-user-row">
          <div class="ds-avatar" id="kv-user-avatar" style="background: linear-gradient(140deg,#2D74D6,#1B4EA0);">—</div>
          <div style="flex:1; min-width:0;">
            <div class="ds-user-name" id="kv-user-name" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Laden…</div>
            <div class="ds-user-role" id="kv-user-role">—</div>
          </div>
          <button class="ds-icon-btn" id="kv-theme-toggle" type="button" aria-label="Wissel thema" title="Wissel thema">
            <!-- Zonnetje (light-mode); JS wisselt niet van icoontje — universele toggle -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ═══ MAIN ═══ -->
    <div class="ds-main" id="kv-main">

      <!-- TOPBAR -->
      <header class="ds-topbar">
        <div class="ds-page-title">
          <span class="ds-title-dot" aria-hidden="true"></span>
          <span>Klanten</span>
          <span class="ds-crumb-sep" id="kv-crumb-sep" hidden>/</span>
          <span class="ds-crumb-cur" id="kv-crumb-cur" hidden></span>
        </div>
        <div class="ds-searchbox" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" placeholder="Zoek klanten…" id="kv-topbar-search" aria-label="Zoek klanten" />
          <span class="ds-kbd">⌘K</span>
        </div>
      </header>

      <!-- CONTENT-SLOT — views renderen hier -->
      <main class="ds-content" id="kv-view"></main>
    </div>
  </div>

  <!-- Toast (globaal, één instance) -->
  <div class="ds-toast" id="kv-toast" role="status" aria-live="polite"></div>

  <!-- Module JS (native ES-modules; requires modern browser) -->
  <script type="module" src="klanten-v2.js"></script>
</body>
</html>
