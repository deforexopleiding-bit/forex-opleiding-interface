<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Document ondertekenen · De Forex Opleiding</title>
<!-- E-handtekening fase 1 (2026-11-09) — bereikbaar via /teken (vercel.json-rewrite).
     Geen login en geen CRM-navigatie: de sleutel is het persoonlijke token in de
     #-hash van de link (gaat nooit naar de server in de URL). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/modules/esign/esign.css?v=1">
</head>
<body>
<header class="es-kop"><div class="es-kop-in">
  <img src="/img/scan/logo-wit.png" width="400" height="226" alt="De Forex Opleiding">
  <span class="es-naam">Document ondertekenen</span>
  <span class="es-rechts"><span class="es-slot" title="Je verbinding is versleuteld">🔒 Beveiligd</span></span>
</div></header>

<main class="teken-wrap" id="main">
  <div class="kaart status-groot" id="laden"><div class="ico" aria-hidden="true">⏳</div><p>Document laden…</p></div>
</main>

<div class="balk verborgen" id="balk" role="region" aria-label="Ondertekenen">
  <div class="balk-in">
    <label class="akkoord"><input type="checkbox" id="akkoord">
      <span>Ik ga ermee akkoord dat ik dit document elektronisch onderteken, en dat mijn elektronische handtekening dezelfde waarde heeft als een handgeschreven handtekening.</span>
    </label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button type="button" class="knop knop-licht" id="volgende">Volgend veld</button>
      <button type="button" class="knop knop-goud" id="verstuur" disabled>Ondertekenen en versturen</button>
    </div>
    <div class="voortgang" id="voortgang" aria-live="polite"></div>
  </div>
</div>

<script type="module" src="/modules/esign/teken.js?v=1"></script>
</body>
</html>
