<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leadsonderhoud · De Forex Opleiding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="/modules/shared/agent-shared.css" />
  <link rel="stylesheet" href="/styles/sales-redesign.css" />
  <style>
    /* Scoped op lo- (leadsonderhoud) zodat niets in andere modules botst.
       Kleuren komen uit de gedeelde thema-variabelen (agent-shared.css), zodat
       licht en donker meelopen met de rest van het CRM. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .app { margin-left: 220px; padding: 22px 26px 60px; max-width: 1320px; }

    .lo-kop { display:flex; align-items:flex-start; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
    .lo-kop h1 { font-size:22px; font-weight:700; }
    .lo-kop p { font-size:13px; color:var(--text-dim); margin-top:2px; }
    .lo-kop-r { margin-left:auto; display:flex; gap:8px; align-items:center; }

    /* schermwissel */
    .lo-tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap; }
    .lo-tab { padding:9px 14px; font-size:13.5px; color:var(--text-dim); border-bottom:2px solid transparent;
      cursor:pointer; background:none; }
    .lo-tab:hover { color:var(--text); }
    .lo-tab.on { color:var(--brand-azure, #1e6cd6); border-bottom-color:var(--brand-azure, #1e6cd6); font-weight:600; }

    /* kpi's */
    .lo-kpis { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
    @media(min-width:900px){ .lo-kpis { grid-template-columns:repeat(4,1fr); } }
    .lo-kaart { background:var(--bg-elev); border:1px solid var(--border); border-radius:11px; padding:15px; }
    .lo-kpi span { display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:3px; }
    .lo-kpi b { display:block; font-size:23px; letter-spacing:-.03em; }
    .lo-kpi i { display:block; font-style:normal; font-size:11px; color:var(--text-faint); margin-top:2px; }

    /* filters */
    .lo-filters { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
    .lo-fl { border:1px solid var(--border); background:var(--bg-elev); border-radius:8px; padding:6px 11px;
      font-size:12.5px; color:var(--text-dim); cursor:pointer; }
    .lo-fl.on { border-color:var(--brand-azure,#1e6cd6); color:var(--brand-azure,#1e6cd6); font-weight:600; }

    /* tabel */
    .lo-tabwrap { overflow-x:auto; border:1px solid var(--border); border-radius:11px; background:var(--bg-elev); }
    table.lo { width:100%; border-collapse:collapse; font-size:13px; }
    table.lo th { text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
      color:var(--text-faint); padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--bg); }
    table.lo td { padding:11px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
    table.lo tr:last-child td { border-bottom:0; }
    .lo-naam b { display:block; font-size:13.5px; }
    .lo-naam span { display:block; font-size:11.5px; color:var(--text-faint); }
    .mono { font-family:'IBM Plex Mono', ui-monospace, monospace; }

    /* merkjes */
    .m { display:inline-flex; align-items:center; gap:4px; border-radius:100px; padding:2px 8px; font-size:11px;
      font-weight:600; white-space:nowrap; }
    .m-gr { background:rgba(23,122,76,.14); color:#177A4C; }
    .m-ro { background:rgba(194,69,45,.14); color:#C2452D; }
    .m-or { background:rgba(180,112,15,.16); color:#B4700F; }
    .m-bl { background:rgba(44,92,158,.14); color:#2C5C9E; }
    .m-gy { background:var(--bg); color:var(--text-dim); }
    .m-wa { background:rgba(37,211,102,.16); color:#0F7A3D; }

    /* warmtebalk */
    .warm { display:inline-flex; align-items:center; gap:8px; }
    .warm-b { width:52px; height:5px; border-radius:100px; background:var(--border); overflow:hidden; flex:none; }
    .warm-b i { display:block; height:100%; border-radius:100px; }
    .warm-n { font-family:'IBM Plex Mono', monospace; font-size:12px; width:22px; text-align:right; }

    .lo-let { display:flex; align-items:center; gap:8px; background:rgba(180,112,15,.12);
      border:1px solid rgba(180,112,15,.3); border-radius:8px; padding:9px 12px; font-size:12.5px;
      color:#B4700F; margin-bottom:16px; line-height:1.45; }
    .lo-inst { display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--border); }
    .lo-inst:last-child { border-bottom:0; }
    .lo-inst-t { flex:1; min-width:0; }
    .lo-inst-t b { display:block; font-size:13.5px; }
    .lo-inst-t span { display:block; font-size:12px; color:var(--text-dim); margin-top:1px; }
    .lo-leeg { display:grid; place-items:center; padding:48px 20px; text-align:center; color:var(--text-faint);
      font-size:13.5px; }
    .lo-traj { margin-bottom:14px; }
    .lo-traj-k { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .lo-traj-k h3 { font-size:15px; }
  </style>
</head>
<body>
<div id="sidebar-mount"></div>
<main class="app" id="app">
  <div class="lo-leeg">Laden…</div>
</main>

<script src="/modules/shared/supabase-client.js"></script>
<script src="/modules/shared/agent-shared.js"></script>
<script src="/modules/shared/theme-shared.js"></script>
<script src="/modules/shared/permissions.js"></script>
<script src="/modules/shared/sidebar.js"></script>
<script>
// ====================================================================
// Leadsonderhoud — de schermen. Alleen lezen uit de views; niets wordt
// hier verstuurd of gewijzigd (dat komt in de motor, een latere stap).
// De toegang wordt server-side afgedwongen: elk endpoint gate't op
// leads.view en geeft 403 als iemand geen recht heeft. De nav-zichtbaarheid
// regelt sidebar.js. Daarom geen inline RBAC-check die vóór permissions.js
// zou kunnen draaien (de valkuil uit #978).
// ====================================================================

// ---- toestand ----
var S = { scherm: 'overzicht', filter: 'alles', over: null, wachtrij: null, trajecten: null };

// ---- hulpjes ----
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id){ return document.getElementById(id); }

/** Warm boven 15 (zelf bellen), midden 5–15, koud onder 5 (laat de motor het doen). */
function warmte(score){
  if (score >= 15) return { kleur:'#C2452D', label:'warm', merk:'m-ro' };
  if (score >= 5)  return { kleur:'#B4700F', label:'midden', merk:'m-or' };
  return { kleur:'var(--border)', label:'koud', merk:'m-gy' };
}
function warmBalk(score){
  var w = warmte(score||0);
  var pct = Math.min(Math.round((score||0)/45*100), 100);
  return '<span class="warm"><span class="warm-b"><i style="width:'+pct+'%;background:'+w.kleur+'"></i></span>'
    + '<span class="warm-n mono">'+(score||0)+'</span></span>';
}
function geleden(iso){
  if (!iso) return null;
  var d = (Date.parse(iso)); if (isNaN(d)) return null;
  var min = Math.floor((Date.now()-d)/60000);
  if (min < 60) return min+' min';
  var u = Math.floor(min/60); if (u < 24) return u+' uur';
  return Math.floor(u/24)+' dagen';
}

/** Gedeelde fetch met het ingelogde token; geeft {} terug bij een fout. */
async function haal(pad){
  var token = '';
  try { token = await window.AuthShared.getAccessToken(); } catch (e) {}
  var r = await fetch(pad, { headers: token ? { Authorization: 'Bearer ' + token } : {} });
  if (!r.ok) throw new Error(pad + ' → ' + r.status);
  return r.json();
}

// ---- raamwerk ----
function tabs(){
  var items = [['overzicht','Overzicht'],['wachtrij','Wachtrij'],['gesprekken','Gesprekken'],
               ['trajecten','Trajecten'],['berichten','Berichten']];
  return '<div class="lo-tabs">' + items.map(function(t){
    return '<button class="lo-tab'+(S.scherm===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';
  }).join('') + '</div>';
}

async function teken(){
  var app = $('app');
  app.innerHTML = tabs() + '<div class="lo-leeg">Laden…</div>';
  bindTabs();
  try {
    if (S.scherm === 'overzicht')  await schermOverzicht();
    else if (S.scherm === 'wachtrij')  await schermWachtrij();
    else if (S.scherm === 'trajecten') await schermTrajecten();
    else if (S.scherm === 'berichten') await schermBerichten();
    else schermGesprekken();
  } catch (e) {
    var body = app.querySelector('.lo-leeg');
    if (body) body.textContent = 'Kon dit scherm niet laden. Ververs de pagina of controleer je rechten.';
    console.error(e);
  }
}
function bindTabs(){
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ S.scherm = b.getAttribute('data-tab'); teken(); };
  });
}
function zetInhoud(html){
  var app = $('app');
  app.innerHTML = tabs() + html;
  bindTabs();
}

// ---- SCHERM: OVERZICHT ----
async function schermOverzicht(){
  if (!S.over) S.over = (await haal('/api/leadsonderhoud-overzicht')).items || [];
  var rijen = S.over.slice();
  if (S.filter === 'warm')  rijen = rijen.filter(function(t){ return t.score >= 15; });
  if (S.filter === 'koud')  rijen = rijen.filter(function(t){ return t.score < 5; });
  if (S.filter === 'geen-gesprek') rijen = rijen.filter(function(t){ return !t.gesprek_op; });
  if (S.filter === 'pauze') rijen = rijen.filter(function(t){ return t.onderhoud_pauze; });

  var warm = S.over.filter(function(t){ return t.score >= 15; }).length;
  var koud = S.over.filter(function(t){ return t.score < 5; }).length;
  var geen = S.over.filter(function(t){ return !t.gesprek_op; }).length;

  var kpis = '<div class="lo-kpis">'
    + kpi('Lopende proefperiodes', S.over.length, S.over.filter(function(t){return t.dagen_over>0;}).length + ' actief')
    + kpi('Warm, score 15+', warm, 'zelf bellen', '#C2452D')
    + kpi('Koud, score onder 5', koud, 'laat de motor het doen')
    + kpi('Nog geen gesprek', geen, 'van de ' + S.over.length, '#B4700F')
    + '</div>';

  var filters = '<div class="lo-filters">' + [['alles','Alles'],['warm','Warm'],['koud','Koud'],
      ['geen-gesprek','Geen gesprek ingepland'],['pauze','Automatisering gepauzeerd']]
    .map(function(f){ return '<button class="lo-fl'+(S.filter===f[0]?' on':'')+'" data-filter="'+f[0]+'">'+f[1]+'</button>'; }).join('')
    + '</div>';

  var tabel = '<div class="lo-tabwrap"><table class="lo"><thead><tr>'
    + '<th>Naam</th><th>Traject</th><th>Dag</th><th>Over</th><th>Lessen</th><th>Trades</th>'
    + '<th>Discord</th><th>Sessie</th><th>Warmte</th><th>Gesprek</th><th>Laatste contact</th><th></th>'
    + '</tr></thead><tbody>'
    + (rijen.length ? rijen.map(rij).join('') : '<tr><td colspan="12" style="text-align:center;color:var(--text-faint);padding:24px">Niemand in deze filter.</td></tr>')
    + '</tbody></table></div>';

  zetInhoud(kop('Leadsonderhoud','Alle lopende proefperiodes, over alle trajecten heen, gesorteerd op hoe warm iemand is.')
    + kpis + filters + tabel);
  document.querySelectorAll('[data-filter]').forEach(function(b){
    b.onclick = function(){ S.filter = b.getAttribute('data-filter'); teken(); };
  });
}
function rij(t){
  var contact = geleden(t.laatste_contact);
  return '<tr>'
    + '<td class="lo-naam"><b>'+esc((t.voornaam||'')+' '+(t.achternaam||''))+'</b><span>'+esc(t.email||'')+'</span></td>'
    + '<td><span class="m m-gy">'+esc(t.traject || '7-daagse')+'</span></td>'
    + '<td class="mono">'+(t.dag!=null?t.dag:'–')+'</td>'
    + '<td>'+(t.dagen_over===0 ? '<span class="m m-gy">verlopen</span>'
        : '<span class="mono">'+t.dagen_over+' dgn</span>'+(t.verlengd?' <span class="m m-bl">verlengd</span>':''))+'</td>'
    + '<td class="mono">'+(t.lessen_gezien!=null?t.lessen_gezien:0)+'</td>'
    + '<td class="mono">'+(t.trades!=null?t.trades:0)+'</td>'
    + '<td>'+(t.discord?'<span class="m m-wa">ja</span>':'<span class="m m-gy">nee</span>')+'</td>'
    + '<td>'+(t.sessie_bijgewoond?'<span class="m m-gr">ja</span>':'<span class="m m-gy">nee</span>')+'</td>'
    + '<td>'+warmBalk(t.score)+'</td>'
    + '<td>'+(t.gesprek_op?'<span class="m m-gr">staat</span>':'<span class="m m-or">nee</span>')+'</td>'
    + '<td style="color:var(--text-faint);font-size:12px">'+(contact?esc(contact)+' geleden':'nog geen contact')+'</td>'
    + '<td>'+(!t.toestemming?'<span class="m m-gy">geen toestemming</span>':t.onderhoud_pauze?'<span class="m m-or">gepauzeerd</span>':'')+'</td>'
    + '</tr>';
}

// ---- SCHERM: WACHTRIJ ----
async function schermWachtrij(){
  if (!S.wachtrij) S.wachtrij = (await haal('/api/leadsonderhoud-wachtrij')).items || [];
  var regels = [
    ['Niets tussen 21:00 en 08:00','Berichten die dan zouden gaan, wachten tot de ochtend.'],
    ['Maximaal één bericht per persoon per dag','Over alle kanalen samen.'],
    ['Nooit WhatsApp zonder toestemming','Wordt in de database al afgedwongen.'],
    ['Eén keer opnieuw bij een fout','Na vijf minuten. Daarna loggen als mislukt.'],
    ['Buiten 24 uur alleen een sjabloon','Meta weigert vrije tekst; het bericht gaat dan verloren.'],
  ];
  var tabel = '<div class="lo-tabwrap"><table class="lo"><thead><tr>'
    + '<th>Naar</th><th>Traject</th><th>Bericht</th><th>Kanaal</th><th>Afzender</th><th>Dag</th><th>Warmte</th><th>Urgentie</th><th></th>'
    + '</tr></thead><tbody>'
    + (S.wachtrij.length ? S.wachtrij.map(function(r){
        var blok = !r.toestemming && r.kanaal === 'whatsapp';
        return '<tr>'
          + '<td class="lo-naam"><b>'+esc(r.voornaam||'')+'</b><span>'+esc(r.kanaal==='mail'?(r.email||''):(r.telefoon_e164||''))+'</span></td>'
          + '<td><span class="m m-gy">'+esc(r.traject||'')+'</span></td>'
          + '<td>'+esc(r.bericht_naam||r.soort||'')+'<br><span class="mono" style="font-size:11px;color:var(--text-faint)">'+esc(r.soort||'')+'</span></td>'
          + '<td>'+(r.kanaal==='whatsapp'?'<span class="m m-wa">WhatsApp</span>':'<span class="m m-bl">Mail</span>')+'</td>'
          + '<td>'+esc(r.agent||'')+'</td>'
          + '<td class="mono">'+(r.dag!=null?r.dag:'–')+'</td>'
          + '<td>'+warmBalk(r.score)+'</td>'
          + '<td class="mono">'+(r.urgentie!=null?r.urgentie:'')+'</td>'
          + '<td>'+(blok?'<span class="m m-ro">geen toestemming</span>':'<span class="m m-gr">klaar</span>')+'</td>'
          + '</tr>';
      }).join('') : '<tr><td colspan="9" style="text-align:center;color:var(--text-faint);padding:24px">De wachtrij is leeg.</td></tr>')
    + '</tbody></table></div>';

  var regelkaart = '<div class="lo-kaart" style="margin-top:16px"><h3 style="font-size:14.5px;margin-bottom:10px">Regels die de motor aanhoudt</h3>'
    + regels.map(function(r){ return '<div class="lo-inst"><div class="lo-inst-t"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div><span class="m m-gr">actief</span></div>'; }).join('')
    + '</div>';

  zetInhoud(kop('Wachtrij','Wat de motor bij de volgende ronde zou versturen. Elke regel is één bericht.')
    + '<div class="lo-let"><span>Zolang de droogloopstand aanstaat, wordt er niets echt verstuurd — je ziet alleen wat er zou gaan.</span></div>'
    + tabel + regelkaart);
}

// ---- SCHERM: TRAJECTEN ----
async function schermTrajecten(){
  if (!S.trajecten) S.trajecten = (await haal('/api/leadsonderhoud-trajecten')).trajecten || [];
  var body = S.trajecten.map(function(tr){
    var stappen = (tr.stappen||[]).map(function(s){
      return '<div class="lo-inst"><div class="lo-inst-t"><b>'+esc(s.naam||s.soort)+'</b>'
        + '<span>'+(s.kanaal==='whatsapp'?'WhatsApp':'Mail')+' · aanleiding '+esc(s.aanleiding||'')
        + (s.waarde!=null?' ('+s.waarde+')':'')+(s.score_min!=null?' · score ≥ '+s.score_min:'')
        + (s.score_max!=null?' · score < '+s.score_max:'')+'</span></div>'
        + '<span class="m '+(s.actief?'m-gr':'m-gy')+'">'+(s.actief?'aan':'uit')+'</span></div>';
    }).join('') || '<div class="lo-leeg">Nog geen stappen voor dit traject.</div>';
    return '<div class="lo-kaart lo-traj"><div class="lo-traj-k"><h3>'+esc(tr.naam)+'</h3>'
      + '<span class="m m-gy">'+esc(tr.slug)+'</span>'+(tr.actief?'':' <span class="m m-or">inactief</span>')
      + '<span style="margin-left:auto;font-size:12px;color:var(--text-dim)">archief na '+(tr.archief_na||30)+' dagen stilte</span></div>'
      + '<p style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">'+esc(tr.omschrijving||'')+'</p>'
      + stappen + '</div>';
  }).join('');
  zetInhoud(kop('Trajecten','Per soort lead de reeks berichten, met hun aanleiding en voorwaarde. Dit bepaalt of het systeem meegroeit.')
    + (body || '<div class="lo-leeg">Nog geen trajecten.</div>'));
}

// ---- SCHERM: BERICHTEN ----
// Toont per traject welke berichten er zijn en via welk kanaal. De teksten en
// aan/uit-schakelaars komen in een latere stap (die schrijven naar de database);
// nu is dit het leesbare overzicht uit onderhoud_stappen.
async function schermBerichten(){
  if (!S.trajecten) S.trajecten = (await haal('/api/leadsonderhoud-trajecten')).trajecten || [];
  var alle = [];
  S.trajecten.forEach(function(tr){ (tr.stappen||[]).forEach(function(s){ alle.push({ tr: tr.naam, s: s }); }); });
  var tabel = '<div class="lo-tabwrap"><table class="lo"><thead><tr>'
    + '<th>Bericht</th><th>Traject</th><th>Kanaal</th><th>Aanleiding</th><th>Status</th>'
    + '</tr></thead><tbody>'
    + (alle.length ? alle.map(function(x){
        return '<tr><td class="lo-naam"><b>'+esc(x.s.naam||x.s.soort)+'</b><span class="mono">'+esc(x.s.soort||'')+'</span></td>'
          + '<td><span class="m m-gy">'+esc(x.tr)+'</span></td>'
          + '<td>'+(x.s.kanaal==='whatsapp'?'<span class="m m-wa">WhatsApp</span>':'<span class="m m-bl">Mail</span>')+'</td>'
          + '<td>'+esc(x.s.aanleiding||'')+'</td>'
          + '<td>'+(x.s.actief?'<span class="m m-gr">aan</span>':'<span class="m m-gy">uit</span>')+'</td></tr>';
      }).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--text-faint);padding:24px">Nog geen berichten.</td></tr>')
    + '</tbody></table></div>';
  zetInhoud(kop('Berichten','Alle berichten per traject. De teksten aanpassen en aan/uit zetten kan zodra de motor er is.')
    + '<div class="lo-let"><span>De WhatsApp-sjablonen moeten eerst door Meta worden goedgekeurd; een sjabloon dat nog niet is goedgekeurd slaat de motor straks zichtbaar over.</span></div>'
    + tabel);
}

// ---- SCHERM: GESPREKKEN (nog te koppelen) ----
function schermGesprekken(){
  zetInhoud(kop('Gesprekken','Antwoorden van proefgebruikers, in de bestaande WhatsApp-inbox.')
    + '<div class="lo-kaart"><div class="lo-leeg" style="gap:10px">'
    + '<i class="ti ti-message-2" style="font-size:26px;color:var(--text-faint)"></i>'
    + '<b style="font-size:14px;color:var(--text)">De inbox wordt hier ingebed</b>'
    + '<span style="max-width:460px">Dit scherm hergebruikt straks de bestaande WhatsApp-inbox, gefilterd op het '
    + 'leadsonderhoud-nummer uit <span class="mono">whatsapp_module_config</span>. Dat nummer en de inbox-port '
    + 'zijn een volgende stap, samen met de motor.</span></div></div>');
}

// ---- kleine bouwstenen ----
function kop(titel, sub){
  return '<div class="lo-kop"><div><h1>'+esc(titel)+'</h1><p>'+esc(sub)+'</p></div></div>';
}
function kpi(label, waarde, onder, kleur){
  return '<div class="lo-kaart lo-kpi"><span>'+esc(label)+'</span>'
    + '<b'+(kleur?' style="color:'+kleur+'"':'')+'>'+waarde+'</b><i>'+esc(onder||'')+'</i></div>';
}

// ---- start ----
(async function init(){
  try { if (window._authSharedReady) await window._authSharedReady; } catch (e) {}
  teken();
})();
