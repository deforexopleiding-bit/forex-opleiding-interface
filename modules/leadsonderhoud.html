<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leadsonderhoud · De Forex Opleiding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="/modules/shared/agent-shared.css" />
  <link rel="stylesheet" href="/styles/sales-redesign.css" />
  <style>
    /* Scoped op lo- (leadsonderhoud) zodat niets in andere modules botst.
       Kleuren komen uit de gedeelde thema-variabelen (agent-shared.css), zodat
       licht en donker meelopen met de rest van het CRM. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .app { margin-left: 220px; padding: 22px 26px 60px; max-width: 1320px; }

    .lo-kop { display:flex; align-items:flex-start; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
    .lo-kop h1 { font-size:22px; font-weight:700; }
    .lo-kop p { font-size:13px; color:var(--text-dim); margin-top:2px; }
    .lo-kop-r { margin-left:auto; display:flex; gap:8px; align-items:center; }

    /* schermwissel */
    .lo-tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap; }
    .lo-tab { padding:9px 14px; font-size:13.5px; color:var(--text-dim); border-bottom:2px solid transparent;
      cursor:pointer; background:none; }
    .lo-tab:hover { color:var(--text); }
    .lo-tab.on { color:var(--brand-azure, #1e6cd6); border-bottom-color:var(--brand-azure, #1e6cd6); font-weight:600; }

    /* kpi's */
    .lo-kpis { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
    @media(min-width:900px){ .lo-kpis { grid-template-columns:repeat(4,1fr); } }
    .lo-kaart { background:var(--bg-elev); border:1px solid var(--border); border-radius:11px; padding:15px; }
    .lo-kpi span { display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:3px; }
    .lo-kpi b { display:block; font-size:23px; letter-spacing:-.03em; }
    .lo-kpi i { display:block; font-style:normal; font-size:11px; color:var(--text-faint); margin-top:2px; }

    /* filters */
    .lo-filters { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
    .lo-fl { border:1px solid var(--border); background:var(--bg-elev); border-radius:8px; padding:6px 11px;
      font-size:12.5px; color:var(--text-dim); cursor:pointer; }
    .lo-fl.on { border-color:var(--brand-azure,#1e6cd6); color:var(--brand-azure,#1e6cd6); font-weight:600; }

    /* tabel */
    .lo-tabwrap { overflow-x:auto; border:1px solid var(--border); border-radius:11px; background:var(--bg-elev); }
    table.lo { width:100%; border-collapse:collapse; font-size:13px; }
    table.lo th { text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
      color:var(--text-faint); padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--bg); }
    table.lo td { padding:11px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
    table.lo tr:last-child td { border-bottom:0; }
    .lo-naam b { display:block; font-size:13.5px; }
    .lo-naam span { display:block; font-size:11.5px; color:var(--text-faint); }
    .mono { font-family:'IBM Plex Mono', ui-monospace, monospace; }

    /* merkjes */
    .m { display:inline-flex; align-items:center; gap:4px; border-radius:100px; padding:2px 8px; font-size:11px;
      font-weight:600; white-space:nowrap; }
    .m-gr { background:rgba(23,122,76,.14); color:#177A4C; }
    .m-ro { background:rgba(194,69,45,.14); color:#C2452D; }
    .m-or { background:rgba(180,112,15,.16); color:#B4700F; }
    .m-bl { background:rgba(44,92,158,.14); color:#2C5C9E; }
    .m-gy { background:var(--bg); color:var(--text-dim); }
    .m-wa { background:rgba(37,211,102,.16); color:#0F7A3D; }

    /* warmtebalk */
    .warm { display:inline-flex; align-items:center; gap:8px; }
    .warm-b { width:52px; height:5px; border-radius:100px; background:var(--border); overflow:hidden; flex:none; }
    .warm-b i { display:block; height:100%; border-radius:100px; }
    .warm-n { font-family:'IBM Plex Mono', monospace; font-size:12px; width:22px; text-align:right; }

    .lo-let { display:flex; align-items:center; gap:8px; background:rgba(180,112,15,.12);
      border:1px solid rgba(180,112,15,.3); border-radius:8px; padding:9px 12px; font-size:12.5px;
      color:#B4700F; margin-bottom:16px; line-height:1.45; }
    .lo-inst { display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--border); }
    .lo-inst:last-child { border-bottom:0; }
    .lo-inst-t { flex:1; min-width:0; }
    .lo-inst-t b { display:block; font-size:13.5px; }
    .lo-inst-t span { display:block; font-size:12px; color:var(--text-dim); margin-top:1px; }
    .lo-leeg { display:grid; place-items:center; padding:48px 20px; text-align:center; color:var(--text-faint);
      font-size:13.5px; }
    .lo-traj { margin-bottom:14px; }
    .lo-traj-k { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .lo-traj-k h3 { font-size:15px; }

    /* knoppen */
    .k { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:7px 13px;
      border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;
      border:1px solid transparent; }
    .k-p { background:var(--brand-azure,#1e6cd6); color:#fff; }
    .k-o { border-color:var(--border); background:var(--bg-elev); color:var(--text-dim); }
    .k-o:hover { color:var(--text); }
    .k-ro { border-color:rgba(194,69,45,.4); background:transparent; color:#C2452D; }
    .k-s { padding:5px 10px; font-size:12px; }

    /* modal */
    .lo-vs { position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:16px;
      background:rgba(10,20,35,.55); }
    .lo-vs[hidden] { display:none; }
    .lo-vk { width:min(560px,100%); max-height:90vh; overflow-y:auto; background:var(--bg-elev);
      border:1px solid var(--border); border-radius:13px; padding:20px; }
    .lo-vk h2 { font-size:18px; margin-bottom:14px; }
    .lo-vk-voet { display:flex; gap:8px; justify-content:space-between; margin-top:18px; align-items:center; }
    .lo-vel { margin-bottom:12px; }
    .lo-vel label { display:block; font-size:12px; font-weight:500; color:var(--text-dim); margin-bottom:4px; }
    .lo-vel input, .lo-vel select, .lo-vel textarea { width:100%; min-height:36px; padding:8px 11px;
      border:1px solid var(--border); border-radius:8px; font-size:13.5px; background:var(--bg); color:var(--text); }
    .lo-vel textarea { min-height:70px; resize:vertical; }
    .lo-vel-rij { display:flex; gap:12px; }
    .lo-vel-rij > .lo-vel { flex:1; }
    .lo-check { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); margin-bottom:8px; }
    .lo-check input { width:auto; min-height:0; }
    .lo-fout { color:#C2452D; font-size:12.5px; margin-top:8px; }

    /* aan/uit-schuif */
    .lo-schuif { width:40px; height:22px; border-radius:100px; background:var(--lijn2,#c9d2dd);
      position:relative; flex:none; cursor:pointer; transition:.16s; }
    .lo-schuif::after { content:""; position:absolute; left:2px; top:2px; width:18px; height:18px;
      border-radius:50%; background:#fff; transition:.16s; }
    .lo-schuif.aan { background:#177A4C; }
    .lo-schuif.aan::after { left:20px; }
  </style>
</head>
<body>
<div id="sidebar-mount"></div>
<main class="app" id="app">
  <div class="lo-leeg">Laden…</div>
</main>
<div class="lo-vs" id="loModal" hidden><div class="lo-vk" id="loModalIn"></div></div>

<script src="/modules/shared/supabase-client.js"></script>
<script src="/modules/shared/agent-shared.js"></script>
<script src="/modules/shared/theme-shared.js"></script>
<script src="/modules/shared/permissions.js"></script>
<script src="/modules/shared/sidebar.js"></script>
<script>
// ====================================================================
// Leadsonderhoud — de schermen. Alleen lezen uit de views; niets wordt
// hier verstuurd of gewijzigd (dat komt in de motor, een latere stap).
// De toegang wordt server-side afgedwongen: elk endpoint gate't op
// leads.view en geeft 403 als iemand geen recht heeft. De nav-zichtbaarheid
// regelt sidebar.js. Daarom geen inline RBAC-check die vóór permissions.js
// zou kunnen draaien (de valkuil uit #978).
// ====================================================================

// ---- toestand ----
var S = { scherm: 'overzicht', filter: 'alles', over: null, wachtrij: null, trajecten: null, droog: null, sjablonen: null };

// ---- hulpjes ----
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id){ return document.getElementById(id); }

/** Warm boven 15 (zelf bellen), midden 5–15, koud onder 5 (laat de motor het doen). */
function warmte(score){
  if (score >= 15) return { kleur:'#C2452D', label:'warm', merk:'m-ro' };
  if (score >= 5)  return { kleur:'#B4700F', label:'midden', merk:'m-or' };
  return { kleur:'var(--border)', label:'koud', merk:'m-gy' };
}
function warmBalk(score){
  var w = warmte(score||0);
  var pct = Math.min(Math.round((score||0)/45*100), 100);
  return '<span class="warm"><span class="warm-b"><i style="width:'+pct+'%;background:'+w.kleur+'"></i></span>'
    + '<span class="warm-n mono">'+(score||0)+'</span></span>';
}
function geleden(iso){
  if (!iso) return null;
  var d = (Date.parse(iso)); if (isNaN(d)) return null;
  var min = Math.floor((Date.now()-d)/60000);
  if (min < 60) return min+' min';
  var u = Math.floor(min/60); if (u < 24) return u+' uur';
  return Math.floor(u/24)+' dagen';
}
/** Kort moment "DD-MM HH:MM" in de tijd van de kijker (voor de droogloop-log). */
function kortMoment(iso){
  if (!iso) return '';
  var d = new Date(iso); if (isNaN(d.getTime())) return '';
  var p = function(n){ return (n<10?'0':'')+n; };
  return p(d.getDate())+'-'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/** Gedeelde fetch met het ingelogde token; geeft {} terug bij een fout. */
async function haal(pad){
  var token = '';
  try { token = await window.AuthShared.getAccessToken(); } catch (e) {}
  var r = await fetch(pad, { headers: token ? { Authorization: 'Bearer ' + token } : {} });
  if (!r.ok) throw new Error(pad + ' → ' + r.status);
  return r.json();
}

/** POST met het ingelogde token; gooit een fout met de servermelding als het misgaat. */
async function haalPost(pad, body){
  var token = '';
  try { token = await window.AuthShared.getAccessToken(); } catch (e) {}
  var r = await fetch(pad, {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
    body: JSON.stringify(body || {}),
  });
  var j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || (pad + ' → ' + r.status));
  return j;
}

// ---- modal ----
function openModal(html){ $('loModalIn').innerHTML = html; $('loModal').hidden = false; }
function sluitModal(){ $('loModal').hidden = true; $('loModalIn').innerHTML = ''; }

/** Bevestig-venster in de modulestijl (vervangt window.confirm — dat blokkeert
 *  ook geautomatiseerd testen). Roept opJa() aan bij bevestigen. */
function bevestig(titel, tekst, knopLabel, opJa){
  openModal('<h2>'+esc(titel)+'</h2>'
    + '<p style="font-size:13.5px;color:var(--text-dim);line-height:1.55">'+esc(tekst)+'</p>'
    + '<div class="lo-vk-voet"><span></span><span>'
    + '<button class="k k-o" id="bv_nee">Annuleren</button> '
    + '<button class="k k-ro" id="bv_ja">'+esc(knopLabel||'Verwijderen')+'</button></span></div>');
  $('bv_nee').onclick = sluitModal;
  $('bv_ja').onclick = function(){ sluitModal(); opJa(); };
}
/** Kort meldingsvenster in de modulestijl (vervangt window.alert). */
function melding(tekst){
  openModal('<p style="font-size:13.5px;color:var(--text);line-height:1.55;margin-bottom:6px">'+esc(tekst)+'</p>'
    + '<div class="lo-vk-voet"><span></span><button class="k k-p" id="ml_ok">OK</button></div>');
  $('ml_ok').onclick = sluitModal;
}
// ---- voorbeeld van een sjabloon (in de module, zonder te versturen) ----
// Neppe gegevens zodat je aanhef, cijfers en knoppen ziet.
function loNepData(){ return { voornaam:'Sanne', lessen:'5', trades:'3', dagen_over:'2', score:'20',
  agendalink:'https://deforexopleiding.nl/gesprek', inloglink:'https://deforexopleiding.nl/lms/voorbeeld',
  datum:'zaterdag 2 augustus', tijd:'14:00' }; }
function loVulNamen(t, v){ return String(t||'').replace(/\{(\w+)\}/g, function(m,k){ return (k in v)?v[k]:m; }); }
function loVulWa(t, volg, v){ return String(t||'').replace(/\{\{(\d+)\}\}/g, function(m,n){ var naam=(volg||[])[Number(n)-1]; return (naam && (naam in v))?v[naam]:m; }); }

function voorbeeld(id){
  var s = (S.sjablonen||[]).filter(function(x){ return x.id===id; })[0];
  if (s) toonVoorbeeld(s, 'html');
}
function toonVoorbeeld(s, formaat){
  var v = loNepData();
  var isMail = s.kanaal === 'mail';
  var body;
  if (isMail && formaat === 'html') {
    var html = loVulNamen(s.html||'', v);
    body = '<iframe style="width:100%;height:56vh;border:1px solid var(--border);border-radius:8px;background:#fff" srcdoc="'+esc(html)+'"></iframe>';
  } else {
    var plat = isMail ? loVulNamen(s.tekst||'', v) : loVulWa(s.tekst||'', s.variabele_volgorde, v);
    body = '<pre style="white-space:pre-wrap;font-family:inherit;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13px;max-height:56vh;overflow:auto">'+esc(plat)+'</pre>';
  }
  var toggle = isMail
    ? '<div style="display:flex;gap:6px;margin-bottom:10px">'
      + '<button class="k k-s '+(formaat==='html'?'k-p':'k-o')+'" id="vb-html">HTML</button>'
      + '<button class="k k-s '+(formaat==='plat'?'k-p':'k-o')+'" id="vb-plat">Platte tekst</button></div>'
    : '';
  openModal('<h2>Voorbeeld</h2>'
    + (isMail
        ? '<p style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px"><b>Onderwerp:</b> '+esc(loVulNamen(s.onderwerp||'', v))+'</p>'
        : '<p style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">WhatsApp-bericht (<b>'+esc(s.meta_template||s.soort)+'</b>)</p>')
    + toggle + body
    + '<div class="lo-vk-voet"><span style="font-size:12px;color:var(--text-faint)">Neppe gegevens ingevuld</span><button class="k k-p" id="vb-ok">Sluiten</button></div>');
  $('vb-ok').onclick = sluitModal;
  if (isMail) { $('vb-html').onclick = function(){ toonVoorbeeld(s, 'html'); }; $('vb-plat').onclick = function(){ toonVoorbeeld(s, 'plat'); }; }
}

/** Zelfde afleiding als de server. De soort vult automatisch mee terwijl je de
 *  naam typt — maar alleen tot je het soort-veld zelf aanraakt, en niet bij het
 *  bewerken van een bestaande stap (dan staat er al een slug). */
var loSoortHandmatig = false;
function loSlug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function loNaamGetypt(){ if(loSoortHandmatig) return; var n=$('sf_naam'), so=$('sf_soort'); if(n&&so) so.value = loSlug(n.value); }
function loSoortGetypt(){ loSoortHandmatig = true; }

// ---- raamwerk ----
function tabs(){
  var items = [['overzicht','Overzicht'],['wachtrij','Wachtrij'],['gesprekken','Gesprekken'],
               ['trajecten','Trajecten'],['berichten','Berichten']];
  return '<div class="lo-tabs">' + items.map(function(t){
    return '<button class="lo-tab'+(S.scherm===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';
  }).join('') + '</div>';
}

async function teken(){
  var app = $('app');
  app.innerHTML = tabs() + '<div class="lo-leeg">Laden…</div>';
  bindTabs();
  try {
    if (S.scherm === 'overzicht')  await schermOverzicht();
    else if (S.scherm === 'wachtrij')  await schermWachtrij();
    else if (S.scherm === 'trajecten') await schermTrajecten();
    else if (S.scherm === 'berichten') await schermBerichten();
    else schermGesprekken();
  } catch (e) {
    var body = app.querySelector('.lo-leeg');
    if (body) body.textContent = 'Kon dit scherm niet laden. Ververs de pagina of controleer je rechten.';
    console.error(e);
  }
}
function bindTabs(){
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ S.scherm = b.getAttribute('data-tab'); teken(); };
  });
}
function zetInhoud(html){
  var app = $('app');
  app.innerHTML = tabs() + html;
  bindTabs();
}

// ---- SCHERM: OVERZICHT ----
async function schermOverzicht(){
  if (!S.over) S.over = (await haal('/api/leadsonderhoud-overzicht')).items || [];
  var rijen = S.over.slice();
  if (S.filter === 'warm')  rijen = rijen.filter(function(t){ return t.score >= 15; });
  if (S.filter === 'koud')  rijen = rijen.filter(function(t){ return t.score < 5; });
  if (S.filter === 'geen-gesprek') rijen = rijen.filter(function(t){ return !t.gesprek_op; });
  if (S.filter === 'pauze') rijen = rijen.filter(function(t){ return t.onderhoud_pauze; });

  var warm = S.over.filter(function(t){ return t.score >= 15; }).length;
  var koud = S.over.filter(function(t){ return t.score < 5; }).length;
  var geen = S.over.filter(function(t){ return !t.gesprek_op; }).length;

  var kpis = '<div class="lo-kpis">'
    + kpi('Lopende leads', S.over.length, S.over.filter(function(t){return t.dagen_over>0;}).length + ' actief')
    + kpi('Warm, score 15+', warm, 'zelf bellen', '#C2452D')
    + kpi('Koud, score onder 5', koud, 'laat de motor het doen')
    + kpi('Nog geen gesprek', geen, 'van de ' + S.over.length, '#B4700F')
    + '</div>';

  var filters = '<div class="lo-filters">' + [['alles','Alles'],['warm','Warm'],['koud','Koud'],
      ['geen-gesprek','Geen gesprek ingepland'],['pauze','Automatisering gepauzeerd']]
    .map(function(f){ return '<button class="lo-fl'+(S.filter===f[0]?' on':'')+'" data-filter="'+f[0]+'">'+f[1]+'</button>'; }).join('')
    + '</div>';

  var tabel = '<div class="lo-tabwrap"><table class="lo"><thead><tr>'
    + '<th>Naam</th><th>Traject</th><th>Dag</th><th>Over</th><th>Lessen</th><th>Trades</th>'
    + '<th>Discord</th><th>Sessie</th><th>Warmte</th><th>Gesprek</th><th>Laatste contact</th><th></th>'
    + '</tr></thead><tbody>'
    + (rijen.length ? rijen.map(rij).join('') : '<tr><td colspan="12" style="text-align:center;color:var(--text-faint);padding:24px">Niemand in deze filter.</td></tr>')
    + '</tbody></table></div>';

  zetInhoud(kop('Leadsonderhoud','Alle lopende leads, over alle trajecten heen, gesorteerd op hoe warm iemand is.')
    + kpis + filters + tabel);
  document.querySelectorAll('[data-filter]').forEach(function(b){
    b.onclick = function(){ S.filter = b.getAttribute('data-filter'); teken(); };
  });
}
function rij(t){
  var contact = geleden(t.laatste_contact);
  return '<tr>'
    + '<td class="lo-naam"><b>'+esc((t.voornaam||'')+' '+(t.achternaam||''))+'</b><span>'+esc(t.email||'')+'</span></td>'
    + '<td><span class="m m-gy">'+esc(t.traject || '7-daagse')+'</span></td>'
    + '<td class="mono">'+(t.dag!=null?t.dag:'–')+'</td>'
    + '<td>'+(t.dagen_over===0 ? '<span class="m m-gy">verlopen</span>'
        : '<span class="mono">'+t.dagen_over+' dgn</span>'+(t.verlengd?' <span class="m m-bl">verlengd</span>':''))+'</td>'
    + '<td class="mono">'+(t.lessen_gezien!=null?t.lessen_gezien:0)+'</td>'
    + '<td class="mono">'+(t.trades!=null?t.trades:0)+'</td>'
    + '<td>'+(t.discord?'<span class="m m-wa">ja</span>':'<span class="m m-gy">nee</span>')+'</td>'
    + '<td>'+(t.sessie_bijgewoond?'<span class="m m-gr">ja</span>':'<span class="m m-gy">nee</span>')+'</td>'
    + '<td>'+warmBalk(t.score)+'</td>'
    + '<td>'+(t.gesprek_op?'<span class="m m-gr">staat</span>':'<span class="m m-or">nee</span>')+'</td>'

// De zes vaste aanleidingen (opdracht: bewust een korte lijst, geen losse SQL).
var AANLEIDINGEN = [
  ['na_start','Na de start (dag X)'],
  ['dag_van_periode','Op een vaste dag in de periode'],
  ['dagen_voor_einde','Aantal dagen voor het einde'],
  ['na_einde','Na het einde'],
  ['geen_activiteit','Bij geen activiteit'],
  ['vast_moment','Vast moment (weekdag + tijd)'],
];
function aanleidingLabel(v){ var x = AANLEIDINGEN.filter(function(a){return a[0]===v;})[0]; return x?x[1]:v; }
function vindTraject(id){ return S.trajecten.filter(function(t){return t.id===id;})[0]; }
function vindStap(id){ for (var i=0;i<S.trajecten.length;i++){ var s=(S.trajecten[i].stappen||[]).filter(function(x){return x.id===id;})[0]; if(s)return s; } return null; }
async function verversTrajecten(){ S.trajecten = (await haal('/api/leadsonderhoud-trajecten')).trajecten || []; teken(); }

async function schermTrajecten(){
  if (!S.trajecten) S.trajecten = (await haal('/api/leadsonderhoud-trajecten')).trajecten || [];
  var body = S.trajecten.map(function(tr){
    var stappen = (tr.stappen||[]).map(function(s){
      return '<div class="lo-inst"><div class="lo-inst-t"><b>'+esc(s.naam||s.soort)+'</b>'
        + '<span>'+(s.kanaal==='whatsapp'?'WhatsApp':'Mail')+' · '+esc(aanleidingLabel(s.aanleiding))
        + (s.waarde!=null?' ('+s.waarde+')':'')+(s.score_min!=null?' · score ≥ '+s.score_min:'')
        + (s.score_max!=null?' · score < '+s.score_max:'')+'</span></div>'
        + '<span class="m '+(s.actief?'m-gr':'m-gy')+'">'+(s.actief?'aan':'uit')+'</span>'
        + '<button class="k k-o k-s" data-stap-edit="'+s.id+'">Aanpassen</button>'

    return '<div class="lo-kaart lo-traj"><div class="lo-traj-k"><h3>'+esc(tr.naam)+'</h3>'
      + '<span class="m m-gy">'+esc(tr.slug)+'</span>'+(tr.actief?'':' <span class="m m-or">inactief</span>')
      + '<span style="margin-left:auto;font-size:12px;color:var(--text-dim)">archief na '+(tr.archief_na||30)+' dagen stilte</span>'
      + '<button class="k k-o k-s" data-traj-edit="'+tr.id+'">Bewerken</button>'
      + '<button class="k k-ro k-s" data-traj-del="'+tr.id+'">Verwijderen</button></div>'
      + '<p style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">'+esc(tr.omschrijving||'')+'</p>'
      + stappen
      + '<div style="margin-top:10px"><button class="k k-o k-s" data-stap-add="'+tr.id+'">+ Stap toevoegen</button></div></div>';
  }).join('');

  var header = '<div class="lo-kop"><div><h1>Trajecten</h1>'
    + '<p>Per soort lead de reeks berichten, met hun aanleiding en voorwaarde. Zo kun je zelf een nieuw traject inrichten.</p></div>'
    + '<div class="lo-kop-r"><button class="k k-p" data-traj-add="1">+ Nieuw traject</button></div></div>';

  zetInhoud(header + (body || '<div class="lo-leeg">Nog geen trajecten. Maak er één aan met "Nieuw traject".</div>'));
  document.querySelectorAll('[data-traj-add]').forEach(function(b){ b.onclick=function(){ trajectForm(null); }; });
  document.querySelectorAll('[data-traj-edit]').forEach(function(b){ b.onclick=function(){ trajectForm(vindTraject(b.getAttribute('data-traj-edit'))); }; });
  document.querySelectorAll('[data-traj-del]').forEach(function(b){ b.onclick=function(){ trajectVerwijderen(b.getAttribute('data-traj-del')); }; });
  document.querySelectorAll('[data-stap-add]').forEach(function(b){ b.onclick=function(){ stapForm(b.getAttribute('data-stap-add'), null); }; });
  document.querySelectorAll('[data-stap-edit]').forEach(function(b){ b.onclick=function(){ var s=vindStap(b.getAttribute('data-stap-edit')); stapForm(s.traject_id, s); }; });
  document.querySelectorAll('[data-stap-del]').forEach(function(b){ b.onclick=function(){ stapVerwijderen(b.getAttribute('data-stap-del')); }; });

    + '</tbody></table></div>';

  zetInhoud(kop('Berichten','De verzend-instellingen en alle sjablonen. Bekijk elk sjabloon met "Voorbeeld", zonder te versturen.')
    + verzendkaart
    + '<div class="lo-let"><span>De WhatsApp-sjablonen moeten eerst door Meta worden goedgekeurd; een sjabloon dat nog niet is goedgekeurd slaat de motor zichtbaar over.</span></div>'
    + tabel);

  var sw = $('lo-live');
  if (sw && !noodstop) sw.onclick = async function(){
    var nieuw = !sw.classList.contains('aan');
    try { await haalPost('/api/leadsonderhoud-instellingen', { live: nieuw }); sw.classList.toggle('aan', nieuw); }
    catch (e) { melding('Kon de schuif niet omzetten: ' + e.message); }
  };
  var tk = $('lo-test-knop');
  if (tk) tk.onclick = async function(){
    var adres = ($('lo-test-adres') || {}).value || '';
    var sjId = ($('lo-test-sj') || {}).value || '';
    var fmt = ($('lo-test-fmt') || {}).value || 'html';
    try { await haalPost('/api/leadsonderhoud-test', { to: adres, sjabloon_id: sjId, formaat: fmt }); melding('Testmail verstuurd naar ' + adres + '.'); }
    catch (e) { melding('Testmail mislukt: ' + e.message); }
  };
  document.querySelectorAll('[data-vb]').forEach(function(b){ b.onclick = function(){ voorbeeld(b.getAttribute('data-vb')); }; });
}

// ---- SCHERM: GESPREKKEN (nog te koppelen) ----
function schermGesprekken(){
  zetInhoud(kop('Gesprekken','Antwoorden van proefgebruikers, in de bestaande WhatsApp-inbox.')
    + '<div class="lo-kaart"><div class="lo-leeg" style="gap:10px">'
    + '<i class="ti ti-message-2" style="font-size:26px;color:var(--text-faint)"></i>'
    + '<b style="font-size:14px;color:var(--text)">De inbox wordt hier ingebed</b>'
    + '<span style="max-width:460px">Dit scherm hergebruikt straks de bestaande WhatsApp-inbox, gefilterd op het '
    + 'leadsonderhoud-nummer uit <span class="mono">whatsapp_module_config</span>. Dat nummer en de inbox-port '
    + 'zijn een volgende stap, samen met de motor.</span></div></div>');
}

// ---- kleine bouwstenen ----
function kop(titel, sub){
  return '<div class="lo-kop"><div><h1>'+esc(titel)+'</h1><p>'+esc(sub)+'</p></div></div>';
}
function kpi(label, waarde, onder, kleur){
  return '<div class="lo-kaart lo-kpi"><span>'+esc(label)+'</span>'
    + '<b'+(kleur?' style="color:'+kleur+'"':'')+'>'+waarde+'</b><i>'+esc(onder||'')+'</i></div>';
}

// ---- start ----
(async function init(){
  try { if (window._authSharedReady) await window._authSharedReady; } catch (e) {}
  teken();
})();
</script>
</body>
</html>
